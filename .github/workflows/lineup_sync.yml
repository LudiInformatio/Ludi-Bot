name: Lineup Sync (9:45 AM EST)

on:
  schedule:
    # 9:45 AM EST = 14:45 UTC
    - cron: '45 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]  # Prevents phantom failure notifications on push

jobs:
  check-slate:
    runs-on: self-hosted
    if: github.event_name != 'push'
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          export PYTHONPATH=$PWD
          set +e
          .venv/bin/python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  lineup-sync:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    concurrency:
      group: lineup-sync
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Sync Starting Lineups
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_lineup_starters.py --mode morning --verbose

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Lineup Sync')" || echo "Solomon notification failed"

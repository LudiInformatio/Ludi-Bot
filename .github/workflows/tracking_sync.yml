name: Daily Tracking Sync (DISABLED - replaced by BDL API in data_sync.yml)

# DISABLED Feb 15, 2026: sync_bdl_tracking.py in data_sync.yml now covers
# defense, drives, touches, speed, synergy. Ghost Protocol (Sun) covers the rest.
# Keep workflow_dispatch for manual use if needed.
on:
  # schedule:
  #   - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync-tracking:
    runs-on: self-hosted
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Sync NBA Tracking Data (Ghost Protocol)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          caffeinate -i python3 scripts/sync_browser_backfill.py --days 1
          echo "✅ Tracking data synced to local database"
          echo "📊 Database updated at: $(date +'%Y-%m-%d %H:%M')"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || echo "Slack notification failed"

name: Daily Tracking Sync

on:
  schedule:
    # 4am EST = 9am UTC (Standard Time) - Heavy Tracking Sync
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  sync-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for git push
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv pytz nba_api

      - name: Sync NBA API Tracking Data (Full Slate)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: python scripts/sync_tracking_daily.py

      - name: Commit and push if changes
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add ludi.db
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: tracking data sync $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ Tracking data synced!"
          fi

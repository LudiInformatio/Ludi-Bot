name: Daily Tracking Sync

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync-tracking:
    runs-on: self-hosted
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Sync NBA API Tracking Data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/run_cyclic_sync.py

      - name: Commit and push if changes
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add ludi.db
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: tracking data sync $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

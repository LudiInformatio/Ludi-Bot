name: Daily Tracking Sync

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync-tracking:
    runs-on: self-hosted
    container:
      image: ludi-core:latest
      options: --volume "/Users/flyprice/Desktop/Ludi Informatio/Projects/Ludi-Bot:/app"
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: /app
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependency installation removed - handled by ludi-core

      - name: Sync NBA API Tracking Data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/run_daily_cycle.py

      - name: Commit and push if changes
        run: |
          git config --global --add safe.directory /app
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add ludi.db
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: tracking data sync $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

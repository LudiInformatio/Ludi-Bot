name: Daily Reports

on:
  schedule:
    # 5am EST = 10am UTC - Work Notes (PM Bot + Settlement Grading)
    - cron: '0 10 * * *'
    # 6am EST = 11am UTC - Bet Summary to Telegram
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to run'
        required: true
        default: 'work_notes'
        type: choice
        options:
          - work_notes
          - bet_summary
          - both

jobs:
  work-notes:
    runs-on: self-hosted
    container:
      image: ludi-core:latest
      # Map the host's workspace to /app inside the container
      # Using --user to match the container user (1001) is handled by the Dockerfile
      # but we need to ensure the volume is writable. 
      # Since we are on self-hosted, we bind mount the current directory.
      options: --volume "/Users/flyprice/Desktop/Ludi Informatio/Projects/Ludi-Bot:/app"
    
    # Run at 5am EST (10am UTC) or when triggered manually with work_notes/both
    if: github.event.schedule == '0 10 * * *' || github.event.inputs.report_type == 'work_notes' || github.event.inputs.report_type == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Note: Python setup and pip install are removed because ludi-core has them pre-installed.

      - name: Settle Pending Bets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=/app
          python settle_bets.py

      - name: Send PM Bot Morning Brief (Work Notes)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=/app
          python -m utils.pm_bot --mode morning

      - name: Commit and push if changes
        # Git config needs to be set because we are in a container
        run: |
          git config --global --add safe.directory /app
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          
          # Only commit if we have changes
          if [[ -n $(git status -s logs/bets/) ]]; then
             git add logs/bets/
             git commit -m "chore: settlement & work notes $(date +'%Y-%m-%d')"
             git push
          else
             echo "No changes to commit"
          fi

  bet-summary:
    runs-on: self-hosted
    container:
      image: ludi-core:latest
      options: --volume "/Users/flyprice/Desktop/Ludi Informatio/Projects/Ludi-Bot:/app"

    # Run at 6am EST (11am UTC) or when triggered manually with bet_summary/both
    if: github.event.schedule == '0 11 * * *' || github.event.inputs.report_type == 'bet_summary' || github.event.inputs.report_type == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Settlement Summary to Telegram
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=/app
          python scripts/send_settlement_summary.py

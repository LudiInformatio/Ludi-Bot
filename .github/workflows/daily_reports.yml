name: Daily Reports

on:
  schedule:
    # 5am EST = 10am UTC - Work Notes (PM Bot + Settlement Grading)
    - cron: '0 10 * * *'
    # 6am EST = 11am UTC - Bet Summary to Telegram
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to run'
        required: true
        default: 'work_notes'
        type: choice
        options:
          - work_notes
          - bet_summary
          - both

jobs:
  work-notes:
    runs-on: self-hosted
    
    # Run at 5am EST (10am UTC) or when triggered manually with work_notes/both
    if: github.event.schedule == '0 10 * * *' || github.event.inputs.report_type == 'work_notes' || github.event.inputs.report_type == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Settle Pending Bets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 settle_bets.py

      - name: Send PM Bot Morning Brief (Work Notes)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 -m utils.pm_bot --mode morning

      - name: Commit and push if changes
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          
          # Only commit if we have changes
          if [[ -n $(git status -s logs/bets/) ]]; then
             git add logs/bets/
             git commit -m "chore: settlement & work notes $(date +'%Y-%m-%d')"
             git push
          else
             echo "No changes to commit"
          fi

  bet-summary:
    runs-on: self-hosted

    # Run at 6am EST (11am UTC) or when triggered manually with bet_summary/both
    if: github.event.schedule == '0 11 * * *' || github.event.inputs.report_type == 'bet_summary' || github.event.inputs.report_type == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Send Settlement Summary to Telegram
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 scripts/send_settlement_summary.py

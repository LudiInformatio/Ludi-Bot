name: Daily Reports

on:
  schedule:
    # 5am EST = 10am UTC - Work Notes (PM Bot + Settlement Grading)
    - cron: '0 10 * * *'
    # 6am EST = 11am UTC - Bet Summary to Telegram
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to run'
        required: true
        default: 'work_notes'
        type: choice
        options:
          - work_notes
          - bet_summary
          - both

jobs:
  work-notes:
    runs-on: self-hosted
    concurrency:
      group: daily-reports-work-notes
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: write  # Required for git push of settlement logs
    # Run at 5am EST (10am UTC) or when triggered manually with work_notes/both
    if: github.event.schedule == '0 10 * * *' || github.event.inputs.report_type == 'work_notes' || github.event.inputs.report_type == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Settle Pending Bets
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python settle_bets.py

      - name: Send PM Bot Morning Brief (Work Notes)
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -m utils.pm_bot --mode morning

      - name: Commit and push if changes
        timeout-minutes: 5
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          
          # Only commit if we have changes
          if [[ -n $(git status -s logs/bets/) ]]; then
             git add logs/bets/
             git commit -m "chore: settlement & work notes $(date +'%Y-%m-%d')"
             git pull --rebase origin main
             git push
          else
             echo "No changes to commit"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Daily Reports (work-notes)')" || echo "Solomon notification failed"

  bet-summary:
    runs-on: self-hosted
    concurrency:
      group: daily-reports-bet-summary
      cancel-in-progress: false
    timeout-minutes: 15
    # When 'both' is dispatched, wait for work-notes (settle_bets.py) to finish
    # before reading settlement data. Prevents read-before-write on bet_recommendations.
    needs: [work-notes]
    if: |
      always() && (
        github.event.schedule == '0 11 * * *' ||
        github.event.inputs.report_type == 'bet_summary' ||
        (github.event.inputs.report_type == 'both' && needs.work-notes.result != 'skipped')
      )
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Send Settlement Summary to Telegram
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/send_settlement_summary.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Daily Reports (bet-summary)')" || echo "Solomon notification failed"

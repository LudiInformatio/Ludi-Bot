name: Daily Database Backup

on:
  schedule:
    - cron: '0 6 * * *'  # 1 AM EST (6 AM UTC) — runs before data_sync (3 AM) to avoid SQLite lock
  workflow_dispatch:
    inputs:
      description:
        description: 'Manual backup trigger'
        required: false

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Check database presence
        id: db
        run: |
          if [[ -f ludi.db ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ Database found locally"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "❌ Database not found at $(pwd)/ludi.db"
          fi

      - name: Report missing database
        if: steps.db.outputs.present != 'true'
        run: |
          echo "ludi.db not found. Database is managed locally and not in git."
          echo "Ensure the self-hosted runner has the database file."
          exit 1

      - name: Create database backup
        if: steps.db.outputs.present == 'true'
        timeout-minutes: 15
        run: |
          bash scripts/backup_database.sh

      - name: List recent backups
        if: steps.db.outputs.present == 'true'
        continue-on-error: true
        run: |
          echo "Recent backups:"
          ls -lht archives/data/ludi.db.backup_*.gz 2>/dev/null | head -5 || echo "No compressed backups found"

      - name: Upload backup artifact
        if: steps.db.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: archives/data/ludi.db.backup_*.gz
          retention-days: 30

      - name: Backup summary
        if: steps.db.outputs.present == 'true'
        continue-on-error: true
        run: |
          BACKUP_COUNT=$(ls -1 archives/data/ludi.db.backup_*.gz 2>/dev/null | wc -l | tr -d ' ')
          echo "✅ Backup complete"
          echo "📊 Total backups: $BACKUP_COUNT"

      # -----------------------------------------------------------------------
      # Overnight CLV Backfill — runs AFTER backup, before data_sync (3 AM EST)
      #
      # Covers ALL game times (day + evening) via date=commence_time on the
      # historical endpoint. Pinnacle (eu) + Novig/ProphetX (us_ex) benchmarks.
      # Flat 10c/game — adding eu+us_ex regions costs nothing extra.
      # -----------------------------------------------------------------------

      - name: Check yesterday's slate (CLV gate)
        id: yesterday_slate
        if: steps.db.outputs.present == 'true'
        timeout-minutes: 5
        run: |
          export PYTHONPATH=$PWD
          # macOS: date -v-1d | Linux: date -d yesterday (both present on self-hosted runner)
          YESTERDAY=$(TZ='America/New_York' date -v-1d +%Y-%m-%d 2>/dev/null || date -d 'yesterday' +%Y-%m-%d)
          echo "Checking slate for $YESTERDAY"
          set +e
          .venv/bin/python scripts/check_slate.py --date "$YESTERDAY"
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
            echo "📅 No games yesterday — skipping CLV backfill"
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
            echo "✅ Games found yesterday — CLV backfill will run"
          fi

      - name: Run overnight CLV backfill (sharp + P2P benchmark)
        if: steps.yesterday_slate.outputs.has_games == 'true'
        timeout-minutes: 30
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          # --yesterday resolves to yesterday EST (handles day games + evening)
          # --reserve 500 stops if < 500 credits remain (protects live pipeline quota)
          .venv/bin/python scripts/backfill_historical_odds.py --yesterday --reserve 500 --verbose

      - name: Capture Closing Lines (CLV — yesterday's games)
        if: steps.yesterday_slate.outputs.has_games == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/capture_closing_lines.py --game-date yesterday

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: DB Backup')" || echo "Solomon notification failed"

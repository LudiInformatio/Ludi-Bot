name: Daily DB Backup

on:
  schedule:
    # 08:40 UTC = 03:40 EST / 04:40 EDT
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check database presence
        id: db
        run: |
          if [[ -f ludi.db ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing database
        if: steps.db.outputs.present != 'true'
        run: |
          echo "ludi.db not found in the repository checkout. Skipping backup."

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        if: steps.db.outputs.present == 'true'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        if: steps.db.outputs.present == 'true'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        if: steps.db.outputs.present == 'true'

      - name: Set timestamp
        id: ts
        run: echo "ts=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
        if: steps.db.outputs.present == 'true'

      - name: Check DB integrity
        id: integrity
        run: |
          python - <<'PY'
          import sqlite3
          import sys
          import os

          db_path = "ludi.db"
          if not os.path.exists(db_path):
            print(f"Missing database: {db_path}")
            sys.exit(1)

          con = sqlite3.connect(db_path)
          try:
            # First try to checkpoint WAL to ensure all changes are merged
            con.execute("PRAGMA wal_checkpoint(TRUNCATE);")
            
            # Run integrity check
            result = con.execute("PRAGMA quick_check;").fetchone()[0]
            print(f"PRAGMA quick_check: {result}")
            
            if result == "ok":
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write("status=ok\n")
            else:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write("status=corrupted\n")
              # Print first few lines of corruption details
              print("Database corruption detected!")
          finally:
            con.close()
          PY
        if: steps.db.outputs.present == 'true'
        continue-on-error: true

      - name: Create backup
        env:
          BACKUP_TS: ${{ steps.ts.outputs.ts }}
          DB_STATUS: ${{ steps.integrity.outputs.status }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import sys

          db_path = "ludi.db"
          backup_dir = os.environ.get("RUNNER_TEMP", ".")
          ts = os.environ["BACKUP_TS"]
          status = os.environ.get("DB_STATUS", "unknown")
          
          # Add status suffix if corrupted
          suffix = ".corrupted" if status == "corrupted" else ""
          backup_path = os.path.join(backup_dir, f"ludi.db.backup_{ts}{suffix}.sqlite")

          con = sqlite3.connect(db_path)
          try:
            dest = sqlite3.connect(backup_path)
            try:
              con.backup(dest)
              print(f"Backup created: {backup_path}")
              if status == "corrupted":
                print("WARNING: Backup created from corrupted database!")
            finally:
              dest.close()
          finally:
            con.close()
          PY
        if: steps.db.outputs.present == 'true'

      - name: Compress backup
        env:
          BACKUP_TS: ${{ steps.ts.outputs.ts }}
          DB_STATUS: ${{ steps.integrity.outputs.status }}
        run: |
          suffix=""
          if [[ "$DB_STATUS" == "corrupted" ]]; then
            suffix=".corrupted"
          fi
          backup_file="ludi.db.backup_${BACKUP_TS}${suffix}.sqlite"
          backup_path="$RUNNER_TEMP/${backup_file}"
          tar -czf "$RUNNER_TEMP/ludi.db.backup_${BACKUP_TS}.tar.gz" -C "$RUNNER_TEMP" "${backup_file}"
          ls -lh "$RUNNER_TEMP/ludi.db.backup_${BACKUP_TS}.tar.gz"
        if: steps.db.outputs.present == 'true'

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludi-db-backup-${{ steps.ts.outputs.ts }}${{ steps.integrity.outputs.status == 'corrupted' && '-CORRUPTED' || '' }}
          path: ${{ runner.temp }}/ludi.db.backup_${{ steps.ts.outputs.ts }}.tar.gz
          retention-days: 30
        if: steps.db.outputs.present == 'true'

      - name: Report corruption
        if: steps.db.outputs.present == 'true' && steps.integrity.outputs.status == 'corrupted'
        run: |
          echo "::warning::Database corruption detected during backup. Backup created but marked as corrupted."
          echo "Consider restoring from a previous backup or running database recovery."
name: Daily DB Backup

on:
  schedule:
    # 08:40 UTC = 03:40 EST / 04:40 EDT
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check database presence
        id: db
        run: |
          if [[ -f ludi.db ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing database
        if: steps.db.outputs.present != 'true'
        run: |
          echo "ludi.db not found in the repository checkout. Skipping backup."

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        if: steps.db.outputs.present == 'true'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        if: steps.db.outputs.present == 'true'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
        if: steps.db.outputs.present == 'true'

      - name: Set timestamp
        id: ts
        run: echo "ts=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
        if: steps.db.outputs.present == 'true'

      - name: Verify DB integrity and create backup
        env:
          BACKUP_TS: ${{ steps.ts.outputs.ts }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import sys

          db_path = "ludi.db"
          if not os.path.exists(db_path):
            print(f"Missing database: {db_path}")
            sys.exit(1)

          backup_dir = os.environ.get("RUNNER_TEMP", ".")
          ts = os.environ["BACKUP_TS"]
          backup_path = os.path.join(backup_dir, f"ludi.db.backup_{ts}.sqlite")

          con = sqlite3.connect(db_path)
          try:
            result = con.execute("PRAGMA quick_check;").fetchone()[0]
            print(f"PRAGMA quick_check: {result}")
            if result != "ok":
              sys.exit(1)

            dest = sqlite3.connect(backup_path)
            try:
              con.backup(dest)
            finally:
              dest.close()
          finally:
            con.close()

          print(f"Backup created: {backup_path}")
          PY
        if: steps.db.outputs.present == 'true'

      - name: Compress backup
        env:
          BACKUP_TS: ${{ steps.ts.outputs.ts }}
        run: |
          backup_path="$RUNNER_TEMP/ludi.db.backup_${BACKUP_TS}.sqlite"
          tar -czf "$RUNNER_TEMP/ludi.db.backup_${BACKUP_TS}.tar.gz" -C "$RUNNER_TEMP" "ludi.db.backup_${BACKUP_TS}.sqlite"
          ls -lh "$RUNNER_TEMP/ludi.db.backup_${BACKUP_TS}.tar.gz"
        if: steps.db.outputs.present == 'true'

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludi-db-backup-${{ steps.ts.outputs.ts }}
          path: ${{ runner.temp }}/ludi.db.backup_${{ steps.ts.outputs.ts }}.tar.gz
          retention-days: 30
        if: steps.db.outputs.present == 'true'
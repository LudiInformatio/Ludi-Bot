name: Daily Database Backup

on:
  schedule:
    - cron: '0 6 * * *'  # 1 AM EST (6 AM UTC) — runs before data_sync (3 AM) to avoid SQLite lock
  workflow_dispatch:
    inputs:
      description:
        description: 'Manual backup trigger'
        required: false

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs

      - name: Check database presence
        id: db
        run: |
          if [[ -f ludi.db ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ Database found locally"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "❌ Database not found at $(pwd)/ludi.db"
          fi

      - name: Report missing database
        if: steps.db.outputs.present != 'true'
        run: |
          echo "ludi.db not found. Database is managed locally and not in git."
          echo "Ensure the self-hosted runner has the database file."
          exit 1

      - name: Create database backup
        if: steps.db.outputs.present == 'true'
        run: |
          bash scripts/backup_database.sh

      - name: List recent backups
        if: steps.db.outputs.present == 'true'
        run: |
          echo "Recent backups:"
          ls -lht archives/data/ludi.db.backup_*.gz 2>/dev/null | head -5 || echo "No compressed backups found"

      - name: Upload backup artifact
        if: steps.db.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: archives/data/ludi.db.backup_*.gz
          retention-days: 30

      - name: Backup summary
        if: steps.db.outputs.present == 'true'
        run: |
          BACKUP_COUNT=$(ls -1 archives/data/ludi.db.backup_*.gz 2>/dev/null | wc -l | tr -d ' ')
          echo "✅ Backup complete"
          echo "📊 Total backups: $BACKUP_COUNT"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || echo "Slack notification failed"

name: Weekly Referee Intelligence Sync

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  sync-referee-intelligence:
    runs-on: self-hosted
    concurrency:
      group: weekly-referee-sync
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright browsers
        run: .venv/bin/python -m playwright install chromium

      - name: Scrape Covers + OddsShark
        timeout-minutes: 30
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          caffeinate -i .venv/bin/python scripts/sync_external_intelligence.py

      - name: Sync WOWY Lineup Data
        continue-on-error: true   # WOWY is enrichment — don't block Covers/OddsShark data commit
        timeout-minutes: 20
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          caffeinate -i .venv/bin/python scripts/sync_wowy_hybrid.py --days 7

      - name: Commit and push if changes
        timeout-minutes: 10
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add logs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly intelligence logs $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Weekly Referee Sync')" || echo "Solomon notification failed"

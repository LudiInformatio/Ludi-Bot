name: Ghost Protocol Tracking Sync

on:
  schedule:
    # Sunday 11:00 UTC (6 AM EST) — weekly catch-up for data not covered by BDL API
    - cron: '0 11 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-protocol-sync
  cancel-in-progress: false

jobs:
  sync-tracking:
    runs-on: self-hosted
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Run Ghost Protocol sync (last 7 days)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          export PYTHONPATH=$PWD
          caffeinate -i python3 scripts/sync_browser_backfill.py --days 7

      - name: Sync Synergy Playtypes (NBA.com)
        run: |
          export PYTHONPATH=$PWD
          caffeinate -i python3 scripts/sync_synergy_playtypes.py --all --season 2025-26

      - name: Sync Defensive Synergy Playtypes (NBA.com)
        run: |
          export PYTHONPATH=$PWD
          caffeinate -i python3 scripts/sync_synergy_playtypes.py --all --defensive --season 2025-26

      - name: Reclassify Player Archetypes
        run: |
          export PYTHONPATH=$PWD
          python3 scripts/reclassify_player_archetypes.py

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ludi-db-post-tracking-sync
          path: ludi.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 -c "from utils.telegram_notifier import send_message; send_message('❌ WORKFLOW FAILED: ${{ github.workflow }} - Check GitHub Actions')" || echo "Telegram notification failed"

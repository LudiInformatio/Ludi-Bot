name: Ghost Protocol Tracking Sync

on:
  schedule:
    # Sunday 11:00 UTC (6 AM EST) — weekly full sweep (last 7 days)
    - cron: '0 11 * * 0'
    # Thursday 11:00 UTC (6 AM EST) — smart gap-fill (re-scrape incomplete dates)
    - cron: '0 11 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-protocol-sync
  cancel-in-progress: false

jobs:
  sync-tracking:
    runs-on: self-hosted
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Run Ghost Protocol sync
        # Phase 8.21 demotion: --skip-advanced skips player_game_advanced writes
        # (BDL V2 advanced stats now via sync_bdl_advanced_stats.py in data_sync.yml)
        # Ghost Protocol still handles: drives, catch_and_shoot, pull_up, closest_defender, clutch
        # Sunday: full 7-day sweep | Thursday: smart gap-fill (only incomplete dates)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          export PYTHONPATH=$PWD
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" = "4" ]; then
            echo "📋 Thursday — smart gap-fill mode"
            caffeinate -i python3 scripts/sync_browser_backfill.py --gap-fill --skip-advanced
          else
            echo "📋 Sunday — full weekly sweep"
            caffeinate -i python3 scripts/sync_browser_backfill.py --days 7 --skip-advanced
          fi

      # Synergy playtypes (isolation PPP, transition, handoff, cut, etc.) now via BDL API:
      # sync_bdl_season_averages.py --category playtype runs weekly in weekly_validation.yml
      # NBA.com browser scraping of synergy data is no longer needed.

      - name: Reclassify Player Archetypes
        run: |
          export PYTHONPATH=$PWD
          python3 scripts/reclassify_player_archetypes.py

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ludi-db-post-tracking-sync
          path: ludi.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || echo "Slack notification failed"

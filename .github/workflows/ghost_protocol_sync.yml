name: Ghost Protocol Tracking Sync

on:
  schedule:
    # Wednesday 11:00 UTC (6 AM EST)
    - cron: '0 11 * * 3'
    # Sunday 11:00 UTC (6 AM EST)  
    - cron: '0 11 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-protocol-sync
  cancel-in-progress: false

jobs:
  sync-tracking:
    runs-on: self-hosted
    container:
      image: ludi-core:latest
      options: --volume "/Users/flyprice/Desktop/Ludi Informatio/Projects/Ludi-Bot:/app"
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python setup and dependency installation removed - handled by ludi-core

      - name: Run Ghost Protocol sync (last 7 days)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          git config --global --add safe.directory /app
          # Ensure playwright browsers path is set correctly if not inherited
          export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
          python scripts/sync_browser_backfill.py --days 7 --headless

      - name: Upload database artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ludi-db-post-tracking-sync
          path: ludi.db
          retention-days: 7

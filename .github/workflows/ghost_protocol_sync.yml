name: Ghost Protocol Tracking Sync

on:
  schedule:
    # Wednesday 11:00 UTC (6 AM EST)
    - cron: '0 11 * * 3'
    # Sunday 11:00 UTC (6 AM EST)  
    - cron: '0 11 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-protocol-sync
  cancel-in-progress: false

jobs:
  sync-tracking:
    runs-on: self-hosted
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Run Ghost Protocol sync (last 7 days)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          export PYTHONPATH=$PWD
          python scripts/sync_browser_backfill.py --days 7 --headless

      - name: Upload database artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ludi-db-post-tracking-sync
          path: ludi.db
          retention-days: 7

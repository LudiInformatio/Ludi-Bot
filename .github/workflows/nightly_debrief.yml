name: Nightly Debrief

on:
  schedule:
    # 8:00 PM EST is 1:00 AM UTC (next day)
    - cron: '0 1 * * *'
    # ONE-TIME TEST: 10:00 PM EST Jan 8, 2026 = 3:00 AM UTC Jan 9, 2026
    - cron: '0 3 9 1 *'
  workflow_dispatch:

jobs:
  debrief:
    runs-on: self-hosted
    container:
      image: ludi-core:latest
      options: --volume "/Users/flyprice/Desktop/Ludi Informatio/Projects/Ludi-Bot:/app"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Python setup and dependency installation removed - handled by ludi-core

      - name: Run Nightly Debrief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=/app
          python -m main --mode pm_debrief

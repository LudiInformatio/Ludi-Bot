name: Claude Ops Hub

# Reactive failure diagnosis — triggers when any monitored workflow fails.
# Claude analyzes logs, identifies root cause, attempts a risk-tiered fix, and notifies via Telegram.
#
# Fix tiers:
#   Tier 1 — AUTO-FIX: Single-line safe fixes (import paths, missing || echo, typos). Commits directly.
#   Tier 2 — CREATE PR: Multi-line or logic changes. Opens a PR for human review.
#   Tier 3 — ISSUE ONLY: Anything touching ludi.db writes, pipeline math, or secrets.
#
# Deduplication: Before creating an issue, checks for existing open ops-hub issue for this workflow.
# If found, adds a comment instead of creating a duplicate.

on:
  workflow_run:
    workflows:
      - "Daily Data Sync"
      - "Daily Production Pipeline"
      - "Daily WOWY Sync"
      - "Daily Morning Briefing"
      - "Nightly Debrief"
      - "Evening Slate Lock (6PM EST)"
      - "Daily Referee Sync"
      - "Ghost Protocol Tracking Sync"
      - "Daily Database Backup"
      - "Weekly Referee Intelligence Sync"
      - "Capture Closing Lines"
      - "Weekly Validation"
      - "Daily Reports"
      - "Claude QA & Debug Check"
      - "PBP Stats WOWY Sync"
    types:
      - completed
  schedule:
    - cron: '0 14 * * *'  # 9 AM EST daily — Claude OAuth token expiry check

jobs:
  diagnose-failure:
    # Only run when a workflow FAILS or is CANCELLED
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required for Tier 1 auto-fix commits and Tier 2 PR creation
      issues: write
      pull-requests: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Ensure ops-hub labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create labels if they don't already exist (idempotent)
          gh label create "ops-hub"          --color "d93f0b" --description "Auto-generated by Claude Ops Hub" 2>/dev/null || true
          gh label create "daily-qa"         --color "0075ca" --description "Daily QA Check reports" 2>/dev/null || true
          gh label create "severity:critical" --color "e11d48" --description "Data loss or pipeline down" 2>/dev/null || true
          gh label create "severity:warning" --color "f59e0b" --description "Degraded mode" 2>/dev/null || true
          gh label create "severity:transient" --color "6b7280" --description "Retry would likely fix" 2>/dev/null || true
          gh label create "auto-fixed"       --color "10b981" --description "Ops Hub committed a fix directly" 2>/dev/null || true
          gh label create "fix-pr"           --color "8b5cf6" --description "Ops Hub opened a PR for review" 2>/dev/null || true

      - name: Fetch failure logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching logs for run ${{ github.event.workflow_run.id }}..."

          # Get the failed step logs (last 300 lines)
          gh run view ${{ github.event.workflow_run.id }} --log-failed 2>&1 | tail -300 > /tmp/failure_log.txt || echo "Could not fetch detailed logs" > /tmp/failure_log.txt

          # Get failed step names
          gh run view ${{ github.event.workflow_run.id }} --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.name): \(.conclusion) — \(.steps[] | select(.conclusion == "failure") | .name)"' \
            > /tmp/failed_steps.txt 2>/dev/null || echo "unknown step" > /tmp/failed_steps.txt

          FAILED_STEPS=$(cat /tmp/failed_steps.txt)
          echo "Failed steps: $FAILED_STEPS"

          LOG_PREVIEW=$(head -50 /tmp/failure_log.txt)
          echo "log_preview<<LOGEOF" >> $GITHUB_OUTPUT
          echo "$LOG_PREVIEW" >> $GITHUB_OUTPUT
          echo "LOGEOF" >> $GITHUB_OUTPUT

          echo "failed_steps<<STEPSEOF" >> $GITHUB_OUTPUT
          echo "$FAILED_STEPS" >> $GITHUB_OUTPUT
          echo "STEPSEOF" >> $GITHUB_OUTPUT

      - name: Check for duplicate open issue
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          # Look for an open ops-hub issue already tracking this workflow
          EXISTING=$(gh issue list \
            --label "ops-hub" \
            --state open \
            --search "[OpsHub] ${WORKFLOW_NAME}" \
            --json number \
            --jq '.[0].number // ""')
          echo "existing_issue=$EXISTING" >> $GITHUB_OUTPUT
          echo "Existing open issue: ${EXISTING:-none}"

      - name: Claude Ops Diagnosis
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
            issues: write
          claude_args: '--allowedTools "Bash(gh:*),Bash(git:*)"'
          prompt: |
            # Claude Ops Hub — Workflow Failure Diagnosis & Fix

            ## STEP 0: Read your institutional memory first
            Run these commands before anything else:
            - `cat best-practices/ops-hub/KNOWN_FIXES.md` — prior diagnosed failures
            - `cat best-practices/ops-hub/DOMAIN_PATTERNS.md` — few-shot diagnosis examples per domain
            If tonight's symptom matches a prior fix, skip investigation and apply the fix immediately.

            ---

            ## VALID OUTPUT SPACE (read before any analysis — only these values are valid)

            Valid Tier Decisions:
              TIER_1 — single-line auto-commit fix, zero logic impact
              TIER_2 — multi-line fix, requires PR + human review
              TIER_3 — issue only, no code change (uncertain, risky, or db-touching)
              TRANSIENT — no action; retry would fix (rate limit, timing, external API down)

            Valid Failure Types:
              KNOWN_PATTERN — matches an entry in KNOWN_FIXES.md
              NEW_FAILURE — not in KNOWN_FIXES.md, requires investigation
              TRANSIENT — retryable; no code change needed

            ---

            === WORKFLOW METADATA ===
            - **Name:** ${{ github.event.workflow_run.name }}
            - **Run ID:** ${{ github.event.workflow_run.id }}
            - **Branch:** ${{ github.event.workflow_run.head_branch }}
            - **Triggered:** ${{ github.event.workflow_run.created_at }}
            - **Failed Steps:** ${{ steps.logs.outputs.failed_steps }}
            - **Existing open issue (if any):** ${{ steps.dedup.outputs.existing_issue }}

            === WORKFLOW FAILURE LOGS (first 50 lines — run `cat /tmp/failure_log.txt` for full) ===
            ```
            ${{ steps.logs.outputs.log_preview }}
            ```

            ---

            ## Your Diagnosis Steps

            ### Step 1: Read full logs and context
            - `cat /tmp/failure_log.txt`
            - `cat best-practices/ops-hub/KNOWN_FIXES.md`

            ### Step 2: NSP Classification Gate (output this JSON FIRST, before any action)
            {"failure_type": "KNOWN_PATTERN|NEW_FAILURE|TRANSIENT", "matched_fix": "<KNOWN_FIXES.md entry date+title or null>", "confidence": "HIGH|MEDIUM|LOW", "reasoning": "<one sentence>"}

            ### Step 3: Apply the fix tier below

            ---

            ## Fix Tiers (MUST follow exactly)

            **TIER 1 — AUTO-FIX (commit directly to main):**
            Only use if ALL of these are true:
            - The fix is a SINGLE LINE change
            - It has zero logic impact (no behavior change, just correctness)
            - Examples: wrong import path, missing `|| echo "..."` on notification step,
              typo in a variable name or SQL column reference, missing `continue-on-error: true`
              on a clearly non-critical step
            - If auto-fixing: commit with message `fix(ops-hub): <brief description>`
              then add label `auto-fixed` to the issue you create

            **TIER 2 — CREATE PR (human approves):**
            Use for: multi-line fixes, logic changes, config updates, adding error handling
            - Create a PR with a clear description of root cause + fix
            - Add label `fix-pr` to the issue you create

            **TIER 3 — ISSUE ONLY (no code change):**
            Use for: ANYTHING touching ludi.db writes, pipeline math/simulations,
            secrets/credentials, infrastructure changes, or any uncertainty
            - Create an issue only — do NOT touch code

            ---

            ## Deduplication
            - If `existing_issue` is NOT empty: add a comment to issue #${{ steps.dedup.outputs.existing_issue }} instead of creating a new one
            - If creating a new issue:
              - **Title:** `[OpsHub] ${{ github.event.workflow_run.name }} — <brief cause>`
              - **Labels:** `ops-hub`, `bug`, AND the appropriate severity label:
                - `severity:critical` = data loss / pipeline fully down
                - `severity:warning` = degraded but functional
                - `severity:transient` = retry would likely fix (rate limit, timeout, etc.)
              - **Body:**
                - Root Cause: What specifically failed and why
                - Failed Step: Which workflow step failed
                - Recommended Fix: Actionable steps to resolve
                - Severity: Critical / Warning / Transient with reasoning
                - Fix Applied: What tier action was taken (auto-fix / PR / issue-only)
                - Log excerpt: Key error lines

            ---

            ## After Every Action (Required — runs after Tier 1, 2, 3, or TRANSIENT)

            1. **Log your diagnosis** — append one entry to `best-practices/ops-hub/KNOWN_FIXES.md`:
               ```
               ## YYYY-MM-DD — WORKFLOW_NAME: one-line summary
               - **Symptom**: ...
               - **Root Cause**: ...
               - **Fix Applied**: Tier N — description  OR  "No auto-fix — issue #N created"
               - **Commit/PR/Issue**: reference
               ```
               Then commit: `git add best-practices/ops-hub/KNOWN_FIXES.md && git commit -m "chore(ops-hub): log diagnosis for WORKFLOW_NAME" && git push`

            2. **Comment on the open issue + close it** (Tier 1 and Tier 2 only):
               ```bash
               ISSUE_NUM=$(gh issue list --label "ops-hub" \
                 --search "[OpsHub] ${{ github.event.workflow_run.name }}" \
                 --state open --json number --jq '.[0].number // empty')
               if [ -n "$ISSUE_NUM" ]; then
                 gh issue comment "$ISSUE_NUM" --body "**Tier N auto-fix applied**
               Root cause: one-liner
               Fix: file:line description
               Commit: hash"
                 gh issue close "$ISSUE_NUM"
               fi
               ```
               (Replace Tier N and brackets with actuals from your diagnosis.)

            ---

            ## Domain Context

            Use the section that matches "${{ github.event.workflow_run.name }}".

            ### Data Sync Domain
            **Matches:** Daily Data Sync, Daily WOWY Sync, Ghost Protocol Tracking Sync, Weekly Referee Intelligence Sync

            **Key Scripts & Tables:**
            - `scripts/sync_wowy_hybrid.py` → team_lineups, four_factor_wowy (NBA Stats API, PBP Stats fallback)
            - `scripts/sync_bdl_tracking.py` → player_defense, player_drives, player_touches, player_speed, player_synergy_playtypes (BDL API)
            - `scripts/sync_four_factor_wowy.py` → four_factor_wowy (PBP Stats)
            - `scripts/sync_team_leverage_profiles.py` → team_leverage_profiles (PBP Stats)
            - `scripts/sync_bdl_clutch_usage.py` → bdl_clutch_usage (BDL API)
            - `scripts/sync_assist_combos.py` → assist_combos (PBP Stats)
            - `scripts/sync_browser_backfill.py` → player_game_tracking (NBA.com via Playwright)
            - `scripts/sync_synergy_playtypes.py` → player_synergy_playtypes (NBA.com via Playwright)
            - Module H (`module_h_historian.py`) → player_game_logs (Tank01 API)

            **Common Failures:**
            - NBA Stats API 403/timeout → Ghost Protocol fallback should activate
            - BDL API 429 rate limit (600 req/min) → retry with backoff (TRANSIENT)
            - PBP Stats 429 → cached responses at cache/ should serve (TRANSIENT)
            - SQLite BUSY → WAL mode conflict, likely concurrent workflow (check schedule)
            - Playwright browser not installed → missing `python3 -m playwright install chromium` step
            - ImportError → check PYTHONPATH is set to $PWD
            - `continue-on-error: true` steps won't cause workflow failure — look at non-optional steps

            ### Pipeline Domain
            **Matches:** Daily Production Pipeline, Daily Morning Briefing, Evening Slate Lock (6PM EST), Nightly Debrief, Daily Reports

            **Pipeline Flow:** Module A (odds) → B (history) → C (simulation) → D (injuries) → E (calibration) → F (edge calc) → Telegram
            **Module Classes:** Gatekeeper, print_sharp_box_score, LudiOracle, LudiYak, LudiCalibrator, LudiReporter, LudiRefEngine, LudiHistorian, ScenarioBuilder

            **Common Failures:**
            - No games today → should exit gracefully, not fail (TRANSIENT)
            - Odds API quota exceeded (20K/mo) → check API dashboard (WARNING)
            - Tank01 daily limit (1K/day) → BDL fallback should activate (TRANSIENT)
            - Telegram send error → verify TELEGRAM_TOKEN + TELEGRAM_CHAT_ID secrets (WARNING)
            - .venv not found → `python3.11 -m venv .venv` step should recreate (WARNING)
            - Missing BALLDONTLIE_KEY or GEMINI_API_KEY → check repository secrets (WARNING)

            ### Database Domain
            **Matches:** Daily Database Backup

            **Script:** `scripts/backup_database.sh`
            **Output:** `archives/data/ludi.db.backup_YYYYMMDD_HHMMSS.gz`

            **Common Failures:**
            - ludi.db not found → runner may have restarted or symlink broken (CRITICAL)
            - Disk space → check available space on runner (WARNING)
            - Permissions → backup script needs write access to archives/data/ (WARNING)

            ### Settlement Domain
            **Matches:** Capture Closing Lines

            **Script:** `scripts/capture_closing_lines.py`
            **Tables:** bet_recommendations (columns: closing_odds_over, closing_odds_under, clv_cents, closing_time)
            **Schema Note:** Column is `bet_side` (not bet_direction), `team` exists directly

            **Common Failures:**
            - No bets to capture → not a real failure, may need graceful exit (TRANSIENT)
            - Odds API empty response → games may not have started yet (TRANSIENT)
            - Odds API quota exhausted (x-requests-remaining: 0) → monthly 20K limit hit; BDL fallback activates (WARNING — check cache/odds_api_quota.json)
            - BDL: 0 scheduled games → BDL V2 uses numeric status codes "1"/"2"/"3", NOT "Scheduled"/"Pre-Game" strings (CODE BUG — check fetch_bdl_games_today() status filter)
            - SQLite lock → concurrent write from another workflow (TRANSIENT)

            ### Validation Domain
            **Matches:** Weekly Validation

            **Scripts:** `scripts/validate_schema.py`, `scripts/validate_canonical_ids.py`

            **Common Failures:**
            - Schema drift → new columns added by sync scripts but not in expected schema (WARNING)
            - Orphaned canonical IDs → players traded/waived but ID mapping not updated (WARNING)
            - Backtest drift > ±3.0 pts → model may need recalibration (WARNING)
            - Phase 8 tables missing → check player_injuries, rotation_profiles, beneficiary_minutes,
              player_stagger_stats, player_stint_profiles, game_notes_log, team_scheme_cache (CRITICAL)

      - name: Verify issue was created (fallback)
        id: verify_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -e
          cd ${{ github.workspace }}
          
          # Check if an ops-hub issue exists for this workflow (dedup step already handles open/comment logic)
          RECENT_ISSUE=$(gh issue list \
            --label "ops-hub" \
            --state open \
            --search "[OpsHub] ${WORKFLOW_NAME}" \
            --json number 2>/dev/null | jq -r '.[0].number // empty' || echo "")
          
          if [ -n "$RECENT_ISSUE" ]; then
            echo "✅ Issue #$RECENT_ISSUE was created successfully"
            echo "issue_created=true" >> $GITHUB_OUTPUT
            echo "issue_number=$RECENT_ISSUE" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "⚠️ No issue detected - creating fallback issue"
          echo "issue_created=false" >> $GITHUB_OUTPUT
          
          # Get failed step name
          FAILED_STEP=$(gh run view ${{ github.event.workflow_run.id }} --json jobs 2>/dev/null | \
            jq -r '.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name' 2>/dev/null | head -1 || echo "unknown")
          
          # Create minimal fallback issue
          FALLBACK_TITLE="[OpsHub] ${WORKFLOW_NAME} - Claude diagnosis completed"
          FALLBACK_BODY="Claude Ops Hub ran but issue creation may have failed. Failed: ${WORKFLOW_NAME}. Step: ${FAILED_STEP}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
          
          FALLBACK_ISSUE=$(gh issue create \
            --title "$FALLBACK_TITLE" \
            --label "ops-hub,bug,severity:warning" \
            --body "$FALLBACK_BODY" 2>&1 || echo "failed")
          
          if echo "$FALLBACK_ISSUE" | grep -q "^https://"; then
            echo "✅ Fallback issue created"
            echo "issue_number=created" >> $GITHUB_OUTPUT
          else
            echo "❌ Fallback issue creation also failed: $FALLBACK_ISSUE"
            echo "issue_number=" >> $GITHUB_OUTPUT
          fi

      - name: Notify via Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          MESSAGE=$(cat <<EOF
          🤖 *Claude Ops Hub*

          🔧 Failure detected: *${WORKFLOW_NAME}*

          Claude analyzed the logs and took action (auto-fix, PR, or issue).

          [View Failed Run](https://github.com/${REPO}/actions/runs/${RUN_ID})
          [View OpsHub Issues](https://github.com/${REPO}/issues?q=is%3Aissue+label%3Aops-hub)
          EOF
          )
          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" || echo "Slack notification failed"

  # ─── Daily Claude OAuth Token Expiry Check ─────────────────────────────────
  # Requires GitHub Actions variable: CLAUDE_TOKEN_EXPIRES_AT (format: YYYY-MM-DD)
  # Set this variable (repo Settings → Variables) when you refresh the OAuth token.
  # To refresh: run `claude auth` on the self-hosted runner, then update both the
  # CLAUDE_CODE_OAUTH_TOKEN secret AND the CLAUDE_TOKEN_EXPIRES_AT variable.
  check-token-expiry:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Claude OAuth token expiry
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EXPIRES_AT: ${{ vars.CLAUDE_TOKEN_EXPIRES_AT }}
        run: |
          if [ -z "$EXPIRES_AT" ]; then
            echo "CLAUDE_TOKEN_EXPIRES_AT variable not set — skipping expiry check"
            echo "To enable: go to repo Settings → Variables and set CLAUDE_TOKEN_EXPIRES_AT=YYYY-MM-DD"
            exit 0
          fi

          NOW=$(date +%s)
          EXP=$(date -d "$EXPIRES_AT" +%s 2>/dev/null || echo "0")
          DAYS_LEFT=$(( (EXP - NOW) / 86400 ))

          echo "CLAUDE_CODE_OAUTH_TOKEN expires: $EXPIRES_AT ($DAYS_LEFT days remaining)"

          if [ "$EXP" -eq 0 ]; then
            echo "Could not parse CLAUDE_TOKEN_EXPIRES_AT='$EXPIRES_AT' — expected YYYY-MM-DD"
            exit 0
          fi

          if [ "$DAYS_LEFT" -le 0 ]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 *Claude OAuth Token EXPIRED* (${DAYS_LEFT#-} day(s) ago)\n\nCLAUDE_CODE_OAUTH_TOKEN expired *${EXPIRES_AT}*. Claude Ops Hub diagnosis is non-functional.\n1. Run: \`claude auth\` on the self-hosted runner\n2. Update CLAUDE_CODE_OAUTH_TOKEN secret in GitHub\n3. Update CLAUDE_TOKEN_EXPIRES_AT variable to new expiry date\"}" || true
            echo "🚨 Slack CRITICAL alert sent — token expired"
          elif [ "$DAYS_LEFT" -le 3 ]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"⚠️ *Claude OAuth Token Expiring in ${DAYS_LEFT} Day(s)*\n\nCLAUDE_CODE_OAUTH_TOKEN expires on *${EXPIRES_AT}*.\n1. Run: \`claude auth\` on the self-hosted runner\n2. Update CLAUDE_CODE_OAUTH_TOKEN secret in GitHub\n3. Update CLAUDE_TOKEN_EXPIRES_AT variable to new expiry date\"}" || true
            echo "⚠️ Slack warning sent — token expires in $DAYS_LEFT days"
          else
            echo "✅ Token valid for $DAYS_LEFT more days — no alert needed"
          fi

name: Injury Refresh (Intraday)

# Keeps player_injuries DB fresh throughout game day.
# The sync script self-throttles via staleness check — if data is already
# current (< threshold minutes old) the script exits early without hitting APIs.
#
# Schedule design:
#   11 AM - 6 PM EDT:  every 2 hours   (4 runs, low API pressure)
#   6 PM  - 11 PM EDT: every 20 min    (15 runs, game-time accuracy)
#
# All times in UTC (EDT = UTC-4)
# Runs are intentionally slightly offset from other workflows to avoid DB lock.

on:
  schedule:
    # --- Daytime: every 2 hours (11 AM, 1 PM, 3 PM, 5 PM EDT) ---
    - cron: '2 15 * * *'   # 11:02 AM EDT
    - cron: '2 17 * * *'   # 1:02  PM EDT
    - cron: '2 19 * * *'   # 3:02  PM EDT
    - cron: '2 21 * * *'   # 5:02  PM EDT

    # --- Evening: every 20 min (6 PM - 10:40 PM EDT) ---
    - cron: '2,22,42 22 * * *'   # 6:02, 6:22, 6:42 PM EDT
    - cron: '2,22,42 23 * * *'   # 7:02, 7:22, 7:42 PM EDT
    - cron: '2,22,42 0 * * *'    # 8:02, 8:22, 8:42 PM EDT
    - cron: '2,22,42 1 * * *'    # 9:02, 9:22, 9:42 PM EDT
    - cron: '2,22,42 2 * * *'    # 10:02, 10:22, 10:42 PM EDT

  workflow_dispatch:
    inputs:
      force:
        description: 'Force refresh even if data is already fresh'
        type: boolean
        default: false

concurrency:
  group: injury-refresh
  cancel-in-progress: false # false — pushes were cancelling scheduled runs (cancel: true + push guard = destructive)

jobs:
  refresh-injuries:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: ESPN Injury Sync (Fast Source)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          # ESPN is the fastest injury source (15-30 min lag vs BDL/Tank01 2-6 hr).
          # Runs first so BDL/Tank01 sync can corroborate ESPN findings.
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_injuries_espn.py

      - name: Sync Injuries
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          export PYTHONPATH=$PWD
          # Game-time runs (6 PM - 10:59 PM EST = 23:00-03:59 UTC) always use --force so
          # BDL/Tank01 corroborates ESPN even after ESPN wrote a fresh snapshot_time.
          # Daytime runs (11 AM - 5 PM EST) use the staleness check to save quota.
          HOUR=$(TZ='America/New_York' date +%H)
          if [ "$HOUR" -ge 18 ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            .venv/bin/python scripts/sync_injuries.py --force
          else
            .venv/bin/python scripts/sync_injuries.py
          fi

name: Stale Issue Cleanup

permissions:
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: '0 4 * * 0'  # Sundays 4:00 UTC (midnight EDT)
  workflow_dispatch:

concurrency:
  group: stale-issue-cleanup
  cancel-in-progress: false

jobs:
  stale:
    runs-on: self-hosted
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 14 days. It will be auto-closed in 16 days if no activity occurs. If this issue is still relevant, please comment to keep it open.'
          close-issue-message: 'Auto-closed after 30 days of inactivity. Reopen if still needed.'
          days-before-stale: 14
          days-before-close: 16
          stale-issue-label: 'stale'
          only-labels: 'ops-hub,daily-qa'
          exempt-issue-labels: 'severity:critical'
          operations-per-run: 30

name: Nightly Empirical Modifiers Compute

on:
  schedule:
    - cron: '30 6 * * *'   # 2:30 AM EDT (UTC-4). Change to '30 7 * * *' when EST resumes.
  workflow_dispatch:

concurrency:
  group: empirical-modifiers
  cancel-in-progress: false

jobs:
  compute-modifiers:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Run empirical modifiers compute
        timeout-minutes: 15
        run: |
          .venv/bin/python scripts/compute_empirical_modifiers.py
        continue-on-error: false

name: Daily WOWY Sync

on:
  schedule:
    # Daily at 11:00 UTC (7:00 AM EDT) — offset from daily_briefing (15:00 UTC) to avoid SQLite lock
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wowy-sync
  cancel-in-progress: false

jobs:
  sync-wowy:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run WOWY sync (yesterday's games)
        timeout-minutes: 30
        run: .venv/bin/python scripts/sync_wowy_hybrid.py --days 1 --ghost

      - name: Run WOWY gap-fill (catch missed dates — last 30 days)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          .venv/bin/python scripts/sync_wowy_hybrid.py \
            --gap-fill \
            --gap-fill-days 30 \
            --ghost

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: WOWY Sync')" || echo "Solomon notification failed"

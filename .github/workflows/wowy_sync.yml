name: Daily WOWY Sync

on:
  schedule:
    # Daily at 12:00 UTC (7:00 AM EST) — offset from daily_briefing (14:00 UTC) to avoid SQLite lock
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wowy-sync
  cancel-in-progress: false

jobs:
  sync-wowy:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs



      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run WOWY sync (yesterday's games)
        run: .venv/bin/python scripts/sync_wowy_hybrid.py --days 1 --ghost

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ludi-db-post-wowy-sync
          path: ludi.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || echo "Slack notification failed"

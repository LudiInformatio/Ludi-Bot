name: Capture Closing Lines

on:
  schedule:
    - cron: '30 23,0,1,2,3,4 * * *'  # 6:30, 7:30, 8:30, 9:30, 10:30, 11:30 PM EST — covers West Coast late tips
  workflow_dispatch:
    inputs:
      game_date:
        description: 'Game date to process (YYYY-MM-DD)'
        required: false
        type: string

concurrency:
  group: capture-closing-lines
  cancel-in-progress: false  # Never cancel — each run captures different game windows

jobs:
  check-slate:
    runs-on: self-hosted
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          source .venv/bin/activate 2>/dev/null || true
          export PYTHONPATH=$PWD
          set +e
          python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  capture-clv:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Sync Injuries (Pre-Tipoff)
        continue-on-error: true  # Tank01/BDL outage must not block CLV capture
        run: |
          source .venv/bin/activate
          python scripts/sync_injuries.py
        env:
          IS_GAME_DAY_REPORT: "true"
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}

      - name: Capture closing lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
        run: |
          # Always pass --game-date in EST to avoid UTC midnight date mismatch
          # (e.g. 11:30 PM EST = next day UTC but still today's game slate)
          if [ -n "${{ github.event.inputs.game_date }}" ]; then
            GAME_DATE="${{ github.event.inputs.game_date }}"
          else
            GAME_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          python3 scripts/capture_closing_lines.py --verbose --game-date "$GAME_DATE"

      - name: Report results
        if: success()
        run: |
          echo "✅ CLV capture completed"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || echo "Slack notification failed"

name: Capture Closing Lines

# Hourly pre-tipoff CLV capture (6:25 PM – 11:25 PM EDT).
# check-slate gate skips non-game nights. Overnight batch in db_backup.yml is fallback.
on:
  schedule:
    # Hourly pre-tipoff CLV capture: 6:25 PM – 11:25 PM EDT
    # check-slate gate skips non-game nights (cheap — just BDL slate check)
    - cron: '25 22 * * *'   # 6:25 PM EDT
    - cron: '25 23 * * *'   # 7:25 PM EDT
    - cron: '25 0 * * *'    # 8:25 PM EDT
    - cron: '25 1 * * *'    # 9:25 PM EDT
    - cron: '25 2 * * *'    # 10:25 PM EDT
    - cron: '25 3 * * *'    # 11:25 PM EDT
  workflow_dispatch:
    inputs:
      game_date:
        description: 'Game date to process (YYYY-MM-DD)'
        required: false
        type: string

concurrency:
  group: capture-closing-lines
  cancel-in-progress: false  # Never cancel — each run captures different game windows

jobs:
  check-slate:
    runs-on: self-hosted
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          export PYTHONPATH=$PWD
          set +e
          # Pass EST date explicitly — at 10-11 PM EDT, UTC is already the next calendar day
          GAME_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          .venv/bin/python scripts/check_slate.py --date "$GAME_DATE"
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  capture-clv:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Capture closing lines
        timeout-minutes: 3
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
          ODDS_API_TIER: paid
        run: |
          # Always pass --game-date in EST to avoid UTC midnight date mismatch
          # (e.g. 11:30 PM EST = next day UTC but still today's game slate)
          if [ -n "${{ github.event.inputs.game_date }}" ]; then
            GAME_DATE="${{ github.event.inputs.game_date }}"
          else
            GAME_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          fi
          .venv/bin/python scripts/capture_closing_lines.py --verbose --game-date "$GAME_DATE"

      - name: Sync Late Game Lineups (if needed)
        continue-on-error: true
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          # Only sync for games where lineup_confirmed=False and tip_time > now + 90 min
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_lineup_starters.py --mode late_games || echo "ℹ️ No late games need lineup sync"

      - name: Report results
        if: success()
        run: |
          echo "✅ CLV capture completed"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Capture Closing Lines')" || echo "Solomon notification failed"

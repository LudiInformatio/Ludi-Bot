name: Daily Referee Sync

on:
  schedule:
    # 9:30 AM ET = 14:30 UTC (Standard Time)
    - cron: '30 14 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  sync-referees:
    runs-on: self-hosted
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Sync Daily Referee Assignments
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          python3 scripts/sync_daily_referees.py

      - name: Verify sync completion
        run: |
          REFEREE_COUNT=$(python3 -c "import sqlite3; conn = sqlite3.connect('ludi.db'); cursor = conn.cursor(); cursor.execute(\"SELECT COUNT(*) FROM games WHERE date = date('now') AND referee_crew IS NOT NULL\"); print(cursor.fetchone()[0]); conn.close()")
          echo "✅ Referee assignments synced: ${REFEREE_COUNT} games updated locally"
          echo "📊 Database updated at: $(date +'%Y-%m-%d %H:%M')"

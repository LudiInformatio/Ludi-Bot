name: Daily Referee Sync

on:
  schedule:
    # 9:30 AM ET = 13:30 UTC (Daylight Time)
    - cron: '30 13 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

concurrency:
  group: referee-sync
  cancel-in-progress: false

jobs:
  check-slate:
    runs-on: self-hosted
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          export PYTHONPATH=$PWD
          set +e
          .venv/bin/python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  sync-referees:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read  # No git push in this workflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Sync Daily Referee Assignments
        timeout-minutes: 15
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_daily_referees.py

      - name: Verify sync completion
        timeout-minutes: 5
        run: |
          REFEREE_COUNT=$(.venv/bin/python -c "
          import sqlite3, pytz
          from datetime import datetime
          today = datetime.now(pytz.timezone('US/Eastern')).strftime('%Y-%m-%d')
          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()
          c.execute('SELECT COUNT(*) FROM games WHERE date = ? AND referee_crew IS NOT NULL', (today,))
          print(c.fetchone()[0])
          conn.close()
          ")
          echo "✅ Referee assignments synced: ${REFEREE_COUNT} games updated locally"
          echo "📊 Database updated at: $(date +'%Y-%m-%d %H:%M')"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Referee Sync')" || echo "Solomon notification failed"

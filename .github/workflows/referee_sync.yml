name: Daily Referee Sync

on:
  schedule:
    # 9:30 AM ET = 14:30 UTC (Standard Time)
    - cron: '30 14 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  sync-referees:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for git push
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Daily Referee Assignments
        env:
          # API keys (not actually used by this script, but prevents import errors in config.py)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          python scripts/sync_daily_referees.py

      - name: Commit and push if changes
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add ludi.db
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit - database already up to date"
          else
            # Get count of games with referees for today to include in commit msg
            REFEREE_COUNT=$(python -c "import sqlite3; conn = sqlite3.connect('ludi.db'); cursor = conn.cursor(); cursor.execute(\"SELECT COUNT(*) FROM games WHERE date = date('now') AND referee_crew IS NOT NULL\"); print(cursor.fetchone()[0]); conn.close()")
            git commit -m "chore: referee sync - ${REFEREE_COUNT} games updated $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ Referee assignments synced and pushed!"
          fi

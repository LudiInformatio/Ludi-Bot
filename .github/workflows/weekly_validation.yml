name: Weekly Validation

on:
  schedule:
    # Tuesdays at 6:00 AM EST (11:00 UTC) — shifted from 4 AM to avoid data_sync write overlap
    - cron: '0 11 * * 2'
  workflow_dispatch:
    inputs:
      backtest_type:
        description: 'Backtest type'
        required: false
        default: 'both'
        type: choice
        options:
          - fatigue_21day
          - playtype_trends_14day
          - both

concurrency:
  group: weekly-validation
  cancel-in-progress: false

jobs:
  run-weekly-validation:
    runs-on: self-hosted
    timeout-minutes: 45
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs
        
      - name: Setup Python Environment
        run: |
          if [ ! -d ".venv" ]; then
            python3.11 -m venv .venv
          fi
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Verify Environment
        run: |
          source .venv/bin/activate
          python -c "import config; print('✅ Environment validated')"
          
      - name: Create Validation Logs Directory
        run: |
          mkdir -p logs/validation
          mkdir -p logs/backtest
          
      - name: Run 21-Day B2B Fatigue Backtest
        if: ${{ github.event.inputs.backtest_type == 'fatigue_21day' || github.event.inputs.backtest_type == 'both' || github.event.inputs.backtest_type == '' }}
        run: |
          source .venv/bin/activate
          echo "🔥 Running 21-Day B2B Fatigue Backtest..."
          python scripts/backtest_fatigue_21day.py --verbose 2>&1 | tee logs/backtest/fatigue_21day_$(date +%Y%m%d).log
          
      - name: Run 14-Day Playtype Trends Backtest
        if: ${{ github.event.inputs.backtest_type == 'playtype_trends_14day' || github.event.inputs.backtest_type == 'both' || github.event.inputs.backtest_type == '' }}
        run: |
          source .venv/bin/activate
          echo "📊 Running 14-Day Playtype Trends Backtest..."
          python scripts/backtest_playtype_trends_14day.py --verbose 2>&1 | tee logs/backtest/playtype_trends_14day_$(date +%Y%m%d).log
          
      - name: Check for Modifier Drift
        run: |
          source .venv/bin/activate
          
          # Check B2B differential from results
          if [ -f "logs/backtest/fatigue_21day_$(date +%Y%m%d).log" ]; then
            B2B_DIFF=$(grep "B2B Differential" logs/backtest/fatigue_21day_$(date +%Y%m%d).log | grep -o "[+-]*[0-9]*\.[0-9]*" | head -1 || true)
            B2B_DIFF="${B2B_DIFF:-0.0}"  # default to 0.0 if grep returned empty

            # Convert to absolute value for comparison
            B2B_ABS=$(echo "$B2B_DIFF" | sed 's/[-+]//g')
            
            if python -c "import sys; exit(0 if float('$B2B_ABS') > 1.5 else 1)"; then
              echo "⚠️ MODIFIER DRIFT DETECTED: B2B differential = $B2B_DIFF pts"
              echo "⚠️ MODIFIER DRIFT: B2B differential exceeds ±1.5 pts threshold" > logs/validation/drift_alert_$(date +%Y%m%d).txt
            else
              echo "✅ B2B modifiers within acceptable range: $B2B_DIFF pts"
            fi
          fi
          
      - name: Generate Weekly Validation Report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          
          REPORT="## 📊 WEEKLY VALIDATION REPORT - $(date +%Y-%m-%d)\n\n"
          
          # Add B2B Fatigue Results
          if [ -f "logs/backtest/fatigue_21day_$(date +%Y%m%d).log" ]; then
            REPORT+="### 🔥 B2B Fatigue (21-Day)\n\`\`\`\n"
            REPORT+=$(tail -20 logs/backtest/fatigue_21day_$(date +%Y%m%d).log)
            REPORT+="\n\`\`\`\n\n"
          fi
          
          # Add Playtype Trends Results
          if [ -f "logs/backtest/playtype_trends_14day_$(date +%Y%m%d).log" ]; then
            REPORT+="### 📈 Playtype Trends (14-Day)\n\`\`\`\n"
            REPORT+=$(tail -20 logs/backtest/playtype_trends_14day_$(date +%Y%m%d).log)
            REPORT+="\n\`\`\`\n\n"
          else
            REPORT+="### 📈 Playtype Trends (14-Day)\n(Log not available)\n\n"
          fi
          
          # Add Drift Alert
          if [ -f "logs/validation/drift_alert_$(date +%Y%m%d).txt" ]; then
            REPORT+="### ⚠️ MODIFIER DRIFT ALERT\n"
            REPORT+=$(cat logs/validation/drift_alert_$(date +%Y%m%d).txt)
            REPORT+="\n\n"
          fi
          
          # Add System Health Summary
          REPORT+="### 🏥 System Health Summary\n\`\`\`\n"
          HEALTH_OUTPUT=$(python scripts/monitor_system_health.py 2>&1)
          echo "$HEALTH_OUTPUT" | tail -10
          REPORT+="\n\`\`\`\n\n"
          
          # Save report
          echo -e "$REPORT" > docs/weekly_validation_$(date +%Y%m%d).md
          
          # Send to Telegram
          python -c "from utils.telegram_notifier import send_daily_briefing; send_daily_briefing('''$REPORT''')" || echo "Telegram notification failed"
          
      - name: Weekly Game Notes Retrospective
        run: |
          source .venv/bin/activate
          echo "Running Weekly Game Notes Retrospective..."
          python scripts/weekly_retrospective.py --verbose || echo "WARNING: Retrospective failed -- continuing"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Weekly Classification (Phase 8.4)
        run: |
          source .venv/bin/activate
          echo "Running Weekly Archetype Classification..."
          python scripts/classify_archetypes.py --window-days 21 --min-games 3 || echo "WARNING: Classification failed -- continuing"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build Player Type Profiles + Classification Profiles
        run: |
          source .venv/bin/activate
          echo "Building player type profiles (archetype + synergy + position layer)..."
          python scripts/build_classification_profiles.py || echo "WARNING: Profile build failed -- continuing"
        continue-on-error: true

      - name: Sync Matchup Intelligence Tables
        run: |
          source .venv/bin/activate
          echo "Building archetype vs defense, team playtype allowed, player roster tables..."
          python scripts/sync_matchup_intelligence.py --window-days 60 || echo "WARNING: Matchup intelligence build failed -- continuing"
        continue-on-error: true

      - name: Run Archetype Correction Pass
        run: |
          source .venv/bin/activate
          echo "Checking for archetype classification drift (synergy-based rules)..."
          python scripts/correct_archetype_classifications.py --apply --rebuild || echo "WARNING: Archetype correction failed -- continuing"
        continue-on-error: true

      - name: Verify Team Classifications (Sprint 3A)
        run: |
          source .venv/bin/activate
          echo "Cross-checking team scheme labels vs def_rating + tracking data + offense stats..."
          python scripts/verify_team_classifications.py --window-days 30 || echo "WARNING: Classification mismatches found — review logs"
        continue-on-error: true

      - name: Claude Smart Scheme Update
        run: |
          source .venv/bin/activate
          echo "Calling Claude Haiku to review scheme labels and apply HIGH-confidence corrections..."
          python scripts/claude_classify_schemes.py || echo "WARNING: Claude scheme update failed -- continuing"
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Update Team Scheme Cache (60d/21d/7d windows)
        run: |
          source .venv/bin/activate
          echo "Re-running scheme cache with [60d, 21d, 7d] voting windows..."
          python scripts/update_team_scheme_cache.py --verbose || echo "WARNING: Scheme cache update failed"
        continue-on-error: true

      - name: Generate League Rankings (Phase 8.10)
        run: |
          source .venv/bin/activate
          python scripts/generate_rankings.py || echo "WARNING: Rankings generation failed -- continuing"
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build ESPN Athlete ID Crosswalk (Phase 8.21 foundation)
        run: |
          source .venv/bin/activate
          echo "Building ESPN athlete ID crosswalk..."
          python scripts/build_espn_crosswalk.py || echo "WARNING: ESPN crosswalk failed -- continuing"
        continue-on-error: true

      - name: Sync Stagger Stats (Phase 8.9-B)
        run: |
          source .venv/bin/activate
          echo "Running Stagger Stats Sync..."
          python scripts/sync_stagger_stats.py --days 60 || echo "WARNING: Stagger stats sync failed -- continuing"
        continue-on-error: true

      - name: Sync Stint Profiles (Phase 8.9-B)
        run: |
          source .venv/bin/activate
          echo "Running Stint Profiles Sync..."
          # Use 60-day window: nba_game_id is only populated through early Feb 2026
          # 21-day window has ~38 games which is insufficient for 5+ games/player
          python scripts/sync_stint_profiles.py --days 60 || echo "WARNING: Stint profiles sync failed -- continuing"
        continue-on-error: true

      - name: BDL Season Averages (tracking, hustle, shotdashboard, playtype — Ghost Protocol synergy demotion)
        # Sprint D: Syncs all 18 category/subtype combos + standings
        # playtype category replaces Ghost Protocol sync_synergy_playtypes.py (NBA.com browser scraping)
        run: |
          source .venv/bin/activate
          echo "Running BDL Season Averages Sync..."
          python scripts/sync_bdl_season_averages.py || echo "WARNING: BDL season averages sync failed -- continuing"
        continue-on-error: true
        timeout-minutes: 20
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}

      - name: Archive Backtest Logs
        run: |
          # Compress logs
          cd logs/backtest
          gzip *.log 2>/dev/null || true

          # Keep last 8 weeks of backtest logs
          find . -name "*.log.gz" -mtime +56 -delete || true
          
      - name: Update Production Documentation
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          # If on main branch, copy latest report to production docs
          if [ -f "docs/weekly_validation_$(date +%Y%m%d).md" ]; then
            cp docs/weekly_validation_$(date +%Y%m%d).md docs/LATEST_WEEKLY_VALIDATION.md
            echo "📄 Updated LATEST_WEEKLY_VALIDATION.md"
          fi
          
      - name: Weekly Ops Digest
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          # Query ops-hub and daily-qa issues from the last 7 days — no Claude needed, pure gh CLI
          SINCE=$(date -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-7d +%Y-%m-%dT%H:%M:%SZ)

          # Get all ops issues in last 7 days
          OPS_JSON=$(gh issue list \
            --label "ops-hub" \
            --state all \
            --limit 50 \
            --json number,title,state,labels,createdAt,closedAt \
            2>/dev/null || echo "[]")

          TOTAL=$(echo "$OPS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")
          OPEN=$(echo "$OPS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for i in d if i['state']=='OPEN'))")
          CLOSED=$(echo "$OPS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for i in d if i['state']=='CLOSED'))")
          AUTO_FIXED=$(echo "$OPS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for i in d if any(l['name']=='auto-fixed' for l in i.get('labels',[]))))")
          FIX_PR=$(echo "$OPS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for i in d if any(l['name']=='fix-pr' for l in i.get('labels',[]))))")
          CRITICAL=$(echo "$OPS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for i in d if any(l['name']=='severity:critical' for l in i.get('labels',[]))))")

          # Build date range label
          WEEK_START=$(date -d '7 days ago' '+%b %d' 2>/dev/null || date -v-7d '+%b %d')
          WEEK_END=$(date '+%b %d')

          # Determine health emoji
          if [ "$CRITICAL" -gt 0 ]; then
            HEALTH="🔴 ${CRITICAL} critical issue(s)"
          elif [ "$OPEN" -gt 0 ]; then
            HEALTH="🟡 ${OPEN} open issue(s)"
          else
            HEALTH="🟢 All clear"
          fi

          # Get open issue titles for pattern summary
          OPEN_TITLES=$(echo "$OPS_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          open_issues = [i['title'] for i in d if i['state'] == 'OPEN']
          print('\n'.join(f'• {t}' for t in open_issues[:5]) if open_issues else '• None')
          ")

          MESSAGE=$(cat <<EOF
          🤖 *Weekly Ops Digest (${WEEK_START}–${WEEK_END})*

          📊 *This week:*
          • ${TOTAL} failure(s) detected
          • ${AUTO_FIXED} auto-fixed ✅
          • ${FIX_PR} PR(s) pending review 🔵
          • ${CLOSED} resolved / ${OPEN} still open

          ${HEALTH}

          📋 *Open issues:*
          ${OPEN_TITLES}

          [View all ops issues →](https://github.com/${REPO}/issues?q=is%3Aissue+label%3Aops-hub)
          EOF
          )

          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" || echo "Ops digest Slack failed"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || echo "Slack notification failed"

      - name: Cleanup Old Artifacts
        run: |
          # Clean validation alerts older than 30 days
          find logs/validation -name "drift_alert_*.txt" -mtime +30 -delete || true

          # Clean weekly validation reports older than 90 days
          find docs -name "weekly_validation_*.md" -mtime +90 -delete || true
name: Evening Slate Lock (6PM EST)

on:
  schedule:
    # 6:00 PM EST = 23:00 UTC (Standard Time)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  check-slate:
    runs-on: self-hosted
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          source .venv/bin/activate 2>/dev/null || true
          export PYTHONPATH=$PWD
          set +e
          python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  evening_lock:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs



      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Verify image pipeline dependencies
        run: |
          python3 -c "from pilmoji import Pilmoji; import PIL; print('img pipeline ok')"



      - name: Run Evening Lock Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          # Run Visual Engine in Evening Mode (Final Lines/Injuries)
          export PYTHONPATH=$PWD
          python3 -m morning_brief --mode evening

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 -c "from utils.telegram_notifier import send_message; send_message('❌ WORKFLOW FAILED: ${{ github.workflow }} - Check GitHub Actions')" || echo "Telegram notification failed"

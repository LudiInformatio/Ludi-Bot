name: Evening Slate Lock (6PM EST)

on:
  schedule:
    # 6:00 PM EST = 23:00 UTC (Standard Time)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  evening_lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify image pipeline dependencies
        run: |
          python -c "from pilmoji import Pilmoji; import PIL; print('img pipeline ok')"

      - name: Install fonts for visual card generation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Run Evening Lock Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          # Run Visual Engine in Evening Mode (Final Lines/Injuries)
          export PYTHONPATH=$PWD
          python -m morning_brief --mode evening
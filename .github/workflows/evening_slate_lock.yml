name: Evening Slate Lock (6PM EST)

on:
  schedule:
    # 6:00 PM EST = 23:00 UTC (Standard Time)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  evening_lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Evening Lock Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          # Run logic AND send telegram directly (bypassing AI if needed)
          python main.py --games CLE SAC LAC --send-telegram

      - name: Commit results
        run: |
          git config user.name "Ludi Bot"
          git config user.email "bot@ludi.com"
          git add daily_briefing.txt
          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Briefing: Evening Lock $(date)"
            git push
          fi
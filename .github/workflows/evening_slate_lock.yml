name: Evening Slate Lock (via launchd)

on:
  workflow_dispatch: # Triggered by launchd at 6:35 PM and 8:20 PM EST — see scripts/launchd/com.ludiinformatio.evening-slate-*.plist


concurrency:
  group: evening-slate-lock
  cancel-in-progress: false # false — pushes were cancelling scheduled runs (cancel: true + push guard = destructive)

jobs:
  check-slate:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          export PYTHONPATH=$PWD
          set +e
          .venv/bin/python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  evening_lock:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs



      - name: Install Dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Sync Starting Lineups (Evening Refresh)
        timeout-minutes: 5
        continue-on-error: true
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_lineup_starters.py --mode evening

      - name: ESPN Injury Sync (Fast Source — 15-30min lag vs BDL/Tank01 2-6hr lag)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          # ESPN updates within 15-30 min of team announcements (free, no auth).
          # Catches same-day rulings (surgery, GTD) before BDL/Tank01 pick them up.
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_injuries_espn.py

      - name: Refresh Injuries (Late Scratches)
        timeout-minutes: 5
        continue-on-error: true
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          # Force refresh so any late scratches (4-6 PM window) are in DB
          # before evening cards generate. Non-fatal if it fails.
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_injuries.py --force

      - name: Run News Agent (Automated News Catalyst Check)
        continue-on-error: true
        timeout-minutes: 8  # Perplexity makes 1 call per Diamond/Blue Chip player — 10-20 players × ~15s each = up to 5 min
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/news_agent.py --mode automated

      - name: Run Evening Lock Briefing
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          export PYTHONPATH=$PWD
          # Detect which run this is by EST hour:
          #   6:35 PM run (23:35 UTC) → early slate only: --before-hour 21 (7 PM–8:30 PM tips)
          #   7:50 PM run (00:50 UTC) → late slate only: --after-hour 21 (9 PM+ tips)
          # This ensures each game is processed exactly once — no duplicate credits.
          CURRENT_HOUR_EST=$(TZ='America/New_York' date +%H)
          if [ "$CURRENT_HOUR_EST" -ge 19 ]; then
            echo "🌅 Late slate run — showing only games tipping at 9 PM EST or later"
            .venv/bin/python -m morning_brief --mode evening --after-hour 21 --force-fresh
          else
            echo "🏀 Early slate run — showing only games tipping before 9 PM EST"
            .venv/bin/python -m morning_brief --mode evening --before-hour 21 --force-fresh
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Evening Slate Lock')" || echo "Solomon notification failed"

name: Claude QA & Debug Check

on:
  schedule:
    # Run daily at 6 AM EDT (10 AM UTC) - after data_sync completes
    - cron: '0 10 * * *'
    # Run daily at 5:30 PM EDT (21:30 UTC) - proactive pre-evening-lock quota check
    - cron: '30 21 * * *'
    # Run daily at 8 PM EDT (midnight UTC) - catch afternoon/evening pipeline failures
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of QA check'
        required: true
        default: 'workflows'
        type: choice
        options:
          - workflows
          - full
          - debug-failures

jobs:
  # ── NEW: 5:30 PM pre-evening-lock health check ─────────────────────────────
  # Runs ONLY on the 5:30 PM cron. QA = checking. If issues found → alert Slack.
  # Ops Hub handles the actual fix. This job exists to give 30 min warning before
  # the 6 PM evening lock fires (quota exhaustion, stale data, etc.).
  pre-evening-check:
    if: github.event.schedule == '30 21 * * *'
    runs-on: self-hosted
    concurrency:
      group: claude-qa-pre-evening
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          if [ ! -d ".venv" ]; then python3.11 -m venv .venv; fi
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Pre-evening-lock quota and freshness check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ISSUES=""

          # 1. Odds API quota cache check
          QUOTA_FILE="cache/odds_api_quota.json"
          if [ -f "$QUOTA_FILE" ]; then
            REMAINING=$(.venv/bin/python -c "import json; d=json.load(open('$QUOTA_FILE')); print(d.get('remaining','unknown'))" 2>/dev/null || echo "unknown")
            AT=$(.venv/bin/python -c "import json; d=json.load(open('$QUOTA_FILE')); print(d.get('at','unknown'))" 2>/dev/null || echo "unknown")
            if [ "$REMAINING" = "0" ]; then
              ISSUES="${ISSUES}:warning: *Odds API quota EXHAUSTED* (as of $AT)\n  Evening lock will rely on BDL fallback only — props may be too sparse to generate bets.\n"
            elif echo "$REMAINING" | grep -qE '^[0-9]+$' && [ "$REMAINING" -lt 500 ]; then
              ISSUES="${ISSUES}:warning: Odds API quota low: *$REMAINING credits remaining*\n"
            fi
          fi

          # 2. Report to Slack if anything looks wrong
          if [ -n "$ISSUES" ]; then
            MSG=":mag: *Pre-Evening-Lock Health Check*\n\n${ISSUES}\n_Evening lock fires at 6:00 PM EST \u2014 ~30 min to respond._"
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"${MSG}\"}" || echo "Slack notification failed (non-fatal)"
            echo "Pre-evening-lock issues reported to Slack"
          else
            echo "Pre-evening-lock check: all clear"
          fi

  # ── Schema validation — skipped on 5:30 PM cron (pre-evening-check handles that slot) ──
  # Always runs — schema validation is a daily health gate, not optional
  validate-schema:
    if: github.event.schedule != '30 21 * * *'
    runs-on: self-hosted
    concurrency:
      group: claude-qa-schema
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      schema_status: ${{ steps.schema.outputs.status }}
      schema_details: ${{ steps.schema.outputs.details }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Setup Python
        run: |
          if [ ! -d ".venv" ]; then python3.11 -m venv .venv; fi
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Validate Schema
        id: schema
        run: |
          export PYTHONPATH=$PWD

          # Run canonical ID validation
          set +e
          CANONICAL_OUT=$(.venv/bin/python scripts/validate_canonical_ids.py -v 2>&1)
          CANONICAL_EXIT=$?
          set -e

          # Determine overall status
          if [ $CANONICAL_EXIT -eq 0 ]; then
            echo "status=PASS" >> $GITHUB_OUTPUT
          else
            echo "status=FAIL" >> $GITHUB_OUTPUT
          fi

          # Capture details for Claude prompt
          DETAILS="Canonical IDs: $(echo "$CANONICAL_OUT" | head -30)"
          echo "details<<DETAILSEOF" >> $GITHUB_OUTPUT
          echo "$DETAILS" >> $GITHUB_OUTPUT
          echo "DETAILSEOF" >> $GITHUB_OUTPUT

          echo "--- Canonical ID Validation ---"
          echo "$CANONICAL_OUT"

  # Runs only when failures exist or full scope requested
  claude-qa:
    needs: [validate-schema]
    runs-on: ubuntu-latest
    concurrency:
      group: claude-qa-report
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get recent workflow failures
        id: failures
        run: |
          # Filter to last 12 hours — prevents old failures bleeding into each run's window.
          # --limit 50: on busy days (15 injury refreshes + 5 CLV + pipeline + briefing etc.)
          # 25 slots exhaust in hours. 50 gives full 12h coverage on any slate day.
          # NOTE: Do NOT mask gh failures with || echo — if this step can't query GitHub,
          # the workflow should FAIL so Claude Ops Hub detects a broken QA layer.
          CUTOFF=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          FAILURES=$(gh run list --limit 50 --json name,conclusion,startedAt,databaseId \
            --jq "[.[] | select(.conclusion == \"failure\" and .startedAt >= \"$CUTOFF\")] | map(\"\(.name) (ID: \(.databaseId))\") | join(\", \")")

          if [ -z "$FAILURES" ]; then
            FAILURES="none"
          fi
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT

          FAIL_COUNT=$(gh run list --limit 50 --json conclusion,startedAt \
            --jq "[.[] | select(.conclusion == \"failure\" and .startedAt >= \"$CUTOFF\")] | length")
          echo "fail_count=$FAIL_COUNT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for duplicate daily QA issue
        id: dedup
        run: |
          TODAY=$(date +%Y-%m-%d)
          EXISTING=$(gh issue list \
            --label "daily-qa" \
            --state open \
            --search "Daily QA Report - $TODAY" \
            --json number \
            --jq '.[0].number // ""')
          echo "existing_issue=$EXISTING" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude QA Check
        if: |
          steps.failures.outputs.fail_count != '0' ||
          needs.validate-schema.outputs.schema_status == 'FAIL' ||
          github.event.inputs.scope == 'full'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are a QA engineer for the Ludi-Bot NBA analytics platform.

            ## Context
            - Repository: ${{ github.repository }}
            - Recent workflow failures: ${{ steps.failures.outputs.failures }}
            - Failure count: ${{ steps.failures.outputs.fail_count }}
            - Schema validation status: ${{ needs.validate-schema.outputs.schema_status }}
            - Schema details: ${{ needs.validate-schema.outputs.schema_details }}
            - Scope: ${{ github.event.inputs.scope || 'workflows' }}
            - Existing QA issue for today (if any): ${{ steps.dedup.outputs.existing_issue }}

            ## Your Task

            ### Deduplication
            If `existing_issue` is NOT empty, do NOT create a new issue.
            Instead, add a comment to issue #${{ steps.dedup.outputs.existing_issue }} with today's update.

            ### If no existing issue (create new):
            Create a GitHub issue titled "Daily QA Report - $(date +%Y-%m-%d)" with label `daily-qa` and include:
            - Workflow status summary (failures found)
            - Schema health: PASS or FAIL with details if failed
            - Any failures and their likely causes
            - Recommended fixes (if any)

            ### Always investigate:
            1. If there are workflow failures:
               - Analyze the failure logs using `gh run view <ID> --log-failed`
               - Identify root causes
            2. If schema status is FAIL:
               - Report which tables or constraints are missing
               - This is HIGH priority — missing Phase 8 tables cause silent pipeline degradation
               - **MUST use label `severity:critical`** for any schema validation failure (not `severity:warning`)

            Keep the report concise and actionable. Label issues with `daily-qa` and appropriate severity.
            Schema failures always get `severity:critical`. Workflow-only failures get `severity:warning` or `severity:transient`.

      - name: Send Telegram notification (failures found)
        if: steps.failures.outputs.fail_count != '0' || needs.validate-schema.outputs.schema_status == 'FAIL'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAIL_COUNT: ${{ steps.failures.outputs.fail_count }}
          FAILURES: ${{ steps.failures.outputs.failures }}
          SCHEMA_STATUS: ${{ needs.validate-schema.outputs.schema_status }}
          REPO: ${{ github.repository }}
        run: |
          SCHEMA_LINE=""
          if [ "$SCHEMA_STATUS" = "FAIL" ]; then
            SCHEMA_LINE="⚠️ Schema validation: FAILED"
          else
            SCHEMA_LINE="✅ Schema validation: OK"
          fi

          MESSAGE=$(cat <<EOF
          🤖 *Claude QA Report*

          ⚠️ *${FAIL_COUNT} workflow failure(s) detected*

          Failed: ${FAILURES}
          ${SCHEMA_LINE}

          Claude is analyzing and will create a GitHub issue.

          [View Actions](https://github.com/${REPO}/actions)
          EOF
          )
          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" || echo "Slack notification failed"

      - name: No failures - send success notification
        if: steps.failures.outputs.fail_count == '0' && needs.validate-schema.outputs.schema_status == 'PASS' && github.event.inputs.scope != 'full'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          echo "✅ No workflow failures in last 24 hours and schema is healthy. Skipping Claude QA."
          MESSAGE=$(cat <<EOF
          🤖 *Claude QA Report*

          ✅ All workflows healthy — no failures in last 24 hours.
          ✅ Schema validation: all tables present.

          [View Actions](https://github.com/${REPO}/actions)
          EOF
          )
          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" || echo "Slack notification failed"

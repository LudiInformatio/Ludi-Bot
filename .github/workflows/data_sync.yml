name: Daily Data Sync

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false  # Never cancel a running sync — data integrity risk

jobs:
  sync-data:
    runs-on: self-hosted
    timeout-minutes: 60  # Prevent infinite hangs
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Initialize database if needed
        run: |
          if [ ! -f ludi.db ]; then
            echo "⚠️ Database not found, initializing..."
            .venv/bin/python database.py
            echo "✅ Database initialized"
          else
            INTEGRITY=$(sqlite3 ludi.db "PRAGMA integrity_check;" 2>&1)
            if [ "$INTEGRITY" != "ok" ]; then
              echo "⚠️ Database corrupted, reinitializing..."
              mv ludi.db ludi.db.corrupted.$(date +%Y%m%d_%H%M%S)
              .venv/bin/python database.py
              echo "✅ Database reinitialized"
            else
              echo "✅ Database exists and is healthy"
            fi
          fi

      - name: Ensure database indexes and data integrity
        run: |
          .venv/bin/python -c "
          import sqlite3
          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()

          # CRITICAL: Deduplicate FIRST (enables unique index creation)
          c.execute('''
              DELETE FROM player_game_logs
              WHERE rowid NOT IN (
                  SELECT MIN(rowid)
                  FROM player_game_logs
                  GROUP BY game_id, player_id
              )
          ''')
          deduped = c.rowcount
          print(f'✅ Deduped {deduped} player_game_logs records')

          # Create UNIQUE index (required for Module H upserts)
          c.execute('CREATE UNIQUE INDEX IF NOT EXISTS idx_player_game_logs_unique ON player_game_logs(player_id, game_date)')

          # Create referee unique index
          c.execute('CREATE UNIQUE INDEX IF NOT EXISTS idx_referee_daily_unique ON referee_daily_stats(referee_id, sync_date)')

          # Create query performance indexes
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_player_date ON player_game_logs(player_id, game_date)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_game_date ON player_game_logs(game_date)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_player_id ON player_game_logs(player_id)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_game_id ON player_game_logs(game_id)')

          conn.commit()
          print('✅ Database indexes and integrity verified')
          conn.close()
          "

      - name: Validate canonical IDs
        continue-on-error: true
        run: |
          .venv/bin/python scripts/validate_canonical_ids.py -v

      - name: Sync Season Schedule (weekly, Sundays)
        # Keeps nba_calendar fresh for check_slate.py gate used by downstream workflows.
        # Run only on Sunday syncs (or manual dispatch) to avoid redundant BDL calls.
        if: ${{ github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true  # Never let schedule sync block other data sync steps
        timeout-minutes: 5
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          .venv/bin/python scripts/sync_season_schedule.py --days 30

      - name: Check slate for extended break
        # Sets is_extended_break output — heavy API steps are skipped during off-season / All-Star break.
        # Fail-open: if this step fails, heavy steps run anyway (assume active season).
        id: slate_check
        continue-on-error: true
        run: |
          export PYTHONPATH=$PWD
          set +e
          .venv/bin/python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "is_extended_break=true" >> $GITHUB_OUTPUT
            echo "📅 Extended break detected — skipping API-heavy sync steps"
          else
            echo "is_extended_break=false" >> $GITHUB_OUTPUT
          fi

      - name: Populate Today's Games (with fallback)
        # Ensures the games table has today's slate before Module H and the simulation run.
        # Tries: The Odds API → Tank01 → BDL. Sends Slack alert + exits 1 if all fail.
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: false
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          .venv/bin/python scripts/populate_todays_games.py

      - name: Run Module H (Fetch recent games)
        if: steps.slate_check.outputs.is_extended_break != 'true'
        timeout-minutes: 10
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          HISTORIAN_MAX_RUNTIME_SEC: 540
          PYTHONUNBUFFERED: "1"
        run: |
          .venv/bin/python module_h_historian.py --mode daily --force-daily

      # NOTE: JSON migration step removed - Module H v2.0 writes directly to SQLite

      - name: Enrich game logs (SportsDataIO — started, DK/FD fantasy pts, home/away, doubles)
        # Sprint A: 3-day rolling default (3 API calls/day, 100/day limit)
        # Fills: started, fantasy_pts_dk, fantasy_pts_fd, home_or_away, double_doubles, triple_doubles, plus_minus (Tier 1)
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
        run: |
          .venv/bin/python scripts/sync_sportsdata_enrichment.py || echo "SportsDataIO enrichment skipped (key not set or quota exceeded)"
          .venv/bin/python scripts/sync_sportsdata_enrichment.py --sync-positions || echo "SportsDataIO position sync skipped"

      - name: Sync Player Foul Splits (Phase 8.17)
        # Phase 8.17: Rolling 21-day foul stats from player_game_logs.pf
        # Builds player_foul_splits table for foul-trouble minutes dampener
        continue-on-error: true
        timeout-minutes: 5
        run: |
          .venv/bin/python scripts/sync_player_foul_splits.py

      - name: BDL V2 Advanced Stats per game (off/def rating, usage, hustle, tracking)
        # Sprint B: Replaces Ghost Protocol daily advanced scraping
        # Writes to: player_game_advanced (UPSERT), player_game_hustle (COALESCE), player_game_tracking speed/distance (COALESCE)
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          .venv/bin/python scripts/sync_bdl_advanced_stats.py || echo "BDL advanced stats skipped"

      - name: BDL plus_minus Tier 2 fill (box scores — fills NULL rows only)
        # Sprint C: COALESCE-only, never overwrites Tank01 or SportsDataIO values
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          .venv/bin/python scripts/sync_bdl_plus_minus.py || echo "BDL plus_minus fill skipped"

      - name: Pre-Pipeline Data Check
        # Phase 3B: Canary check that Module H wrote fresh data before the 11 AM simulation
        # continue-on-error so the rest of data_sync (WOWY, depth charts, etc.) still runs
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/validate_pipeline_output.py --mode pre

      - name: Sync PBP Stats Season Totals
        timeout-minutes: 15
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/sync_pbp_totals.py

      - name: Sync Depth Charts
        continue-on-error: true
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/sync_depth_charts.py

      - name: Sync PBP Shot Quality
        continue-on-error: true
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/sync_pbp_shot_quality.py

      - name: Sync Injuries (Overnight Refresh)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # --force bypasses _is_db_fresh() so BDL/Tank01 runs even if ESPN wrote
          # a recent snapshot_time during last night's intraday cycles (< 8h old).
          .venv/bin/python scripts/sync_injuries.py --force
        env:
          IS_GAME_DAY_REPORT: "false"
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}

      - name: Sync Suspensions (ESPN — no API key required)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          .venv/bin/python scripts/sync_suspensions_espn.py

      - name: Sync BDL Clutch Usage
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          .venv/bin/python scripts/sync_bdl_clutch_usage.py

      - name: Sync Assist Combos
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          .venv/bin/python scripts/sync_assist_combos.py

      - name: Sync BDL Tracking Data
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          .venv/bin/python scripts/sync_bdl_tracking.py --all

      - name: Build Rotation Profiles (Phase 8.9)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          .venv/bin/python scripts/build_rotation_profiles.py --window-days 21 --min-games 3

      - name: Build WOWY Observed (Phase 2B — starter-filtered beneficiary performance)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          .venv/bin/python scripts/build_wowy_observed.py || echo "WOWY observed build skipped"

      - name: Build Player Trends (Phase 8.15)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          .venv/bin/python scripts/build_player_trends.py

      - name: Build Stat Confidence Cache (Phase 8.20)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          .venv/bin/python scripts/build_stat_confidence.py

      - name: Update Team Scheme Cache
        continue-on-error: true
        timeout-minutes: 5
        run: |
          .venv/bin/python scripts/update_team_scheme_cache.py --db-path ludi.db --verbose
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Validate data freshness
        run: |
          .venv/bin/python -c "
          import sqlite3
          from datetime import date, timedelta, datetime, timezone

          STALE_DAYS = 8

          def calendar_expectation(cursor, date_str):
              try:
                  row = cursor.execute(
                      'SELECT has_games, game_count, synced_at FROM nba_calendar WHERE date = ?',
                      (date_str,),
                  ).fetchone()
              except Exception:
                  return None

              if not row or not row[2]:
                  return None

              try:
                  sync_dt = datetime.fromisoformat(str(row[2]).replace('Z', '+00:00'))
                  now_dt = datetime.now(timezone.utc)
                  if (now_dt - sync_dt).days > STALE_DAYS:
                      return None
              except Exception:
                  return None

              has_games = row[0] == 1
              game_count = row[1] if row[1] is not None else 0
              expected_label = str(game_count) if game_count else 'unknown'
              return has_games, game_count, expected_label

          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()
          yesterday = (date.today() - timedelta(days=1)).isoformat()

          expected = calendar_expectation(c, yesterday)
          if expected is not None:
              has_games, expected_count, expected_label = expected
              if not has_games:
                  print(f'✅ No games on {yesterday} (nba_calendar) — stale data expected, skipping freshness check')
                  conn.close()
                  exit(0)
          else:
              c.execute('SELECT COUNT(*) FROM games WHERE date = ?', (yesterday,))
              expected_count = c.fetchone()[0]
              expected_label = str(expected_count)
              if expected_count == 0:
                  print(f'✅ No games on {yesterday} — stale data expected, skipping freshness check')
                  conn.close()
                  exit(0)

          # Games expected — verify we got game log data
          c.execute('SELECT COUNT(*) FROM player_game_logs WHERE game_date = ?', (yesterday,))
          logs_count = c.fetchone()[0]

          if logs_count == 0:
              print(f'❌ CRITICAL: {expected_label} games expected on {yesterday} but 0 player_game_logs synced')
              print('Module H (Historian) may have failed silently')
              conn.close()
              exit(1)

          # Check enrichment table freshness (warn only, don't fail)
          enrichment = {
              'team_lineups': 'SELECT COUNT(*) FROM team_lineups',
              'four_factor_wowy': 'SELECT COUNT(*) FROM four_factor_wowy',
              'player_defense': 'SELECT COUNT(*) FROM player_defense',
          }
          stale = []
          for table, query in enrichment.items():
              try:
                  c.execute(query)
                  count = c.fetchone()[0]
                  if count == 0:
                      stale.append(table)
              except Exception:
                  stale.append(f'{table} (missing)')

          if stale:
              print(f'⚠️ WARNING: Empty enrichment tables: {stale}')
              print('Individual sync steps may have failed — check logs above')
          else:
              print(f'✅ All enrichment tables populated')

          print(f'✅ Freshness check passed: {logs_count} game logs for {yesterday} ({expected_label} games expected)')
          conn.close()
          "

      - name: Deduplicate games table
        timeout-minutes: 5
        run: |
          .venv/bin/python -c "
          import sqlite3
          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()
          # Note: player_game_logs deduplication now happens in 'Ensure database indexes' step
          c.execute('DELETE FROM games WHERE rowid NOT IN (SELECT MIN(rowid) FROM games GROUP BY game_id)')
          deleted = c.rowcount
          print(f'Deleted {deleted} duplicate games')
          conn.commit()
          c.execute('SELECT COUNT(*), MAX(game_date) FROM player_game_logs')
          logs = c.fetchone()
          print(f'Database: {logs[0]} records through {logs[1]}')
          conn.close()
          "

      - name: Validate Canonical IDs
        timeout-minutes: 2
        run: |
          .venv/bin/python scripts/validate_canonical_ids.py --warn-threshold 100 -v

      - name: Learn Daily Referee Trends
        continue-on-error: true  # Non-critical: referee trends are supplementary
        timeout-minutes: 5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/learn_daily_trends.py

      - name: Sync Team Betting Trends (H/A records + scoring + ATS)
        continue-on-error: true  # Non-critical: supplementary context for bet cards
        timeout-minutes: 3
        run: |
          .venv/bin/python scripts/sync_team_betting_trends.py

      - name: Sync Scoring Environment (Phase 8.14)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          .venv/bin/python scripts/sync_scoring_environment.py

      - name: Analyze Star Bias
        continue-on-error: true  # Non-critical: star bias is supplementary data
        timeout-minutes: 5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/analyze_star_bias.py

      - name: Sync Team Current Info (Tank01)
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/sync_team_current_info.py

      - name: Sync Tank01 Projections (Benchmark)
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/sync_tank01_projections.py

      - name: Sync Player News Cache (Tank01)
        if: steps.slate_check.outputs.is_extended_break != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          .venv/bin/python scripts/sync_player_news.py

      - name: Commit and push if changes
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add logs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: data sync $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Cleanup old logs
        if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          .venv/bin/python scripts/cleanup_old_logs.py --verbose

      - name: Cleanup old game intelligence caches
        run: |
          .venv/bin/python -c "
          from datetime import date, timedelta
          from pathlib import Path
          
          cache_dir = Path('cache')
          if not cache_dir.exists():
              print('No cache directory, skipping')
              exit(0)
          
          yesterday = (date.today() - timedelta(days=1)).strftime('%Y-%m-%d')
          cache_file = cache_dir / f'game_intelligence_{yesterday}.json'
          
          if cache_file.exists():
              cache_file.unlink()
              print(f'Deleted old cache: {cache_file.name}')
          else:
              print(f'No old cache to delete')
          "

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Daily Data Sync')" || echo "Solomon notification failed"

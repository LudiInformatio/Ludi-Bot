name: Daily Data Sync

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: self-hosted
    timeout-minutes: 60  # Prevent infinite hangs
    env:
      IS_SELF_HOSTED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false  # Preserve ludi.db between runs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Initialize database if needed
        run: |
          if [ ! -f ludi.db ]; then
            echo "⚠️ Database not found, initializing..."
            python3 database.py
            echo "✅ Database initialized"
          else
            INTEGRITY=$(sqlite3 ludi.db "PRAGMA integrity_check;" 2>&1)
            if [ "$INTEGRITY" != "ok" ]; then
              echo "⚠️ Database corrupted, reinitializing..."
              mv ludi.db ludi.db.corrupted.$(date +%Y%m%d_%H%M%S)
              python3 database.py
              echo "✅ Database reinitialized"
            else
              echo "✅ Database exists and is healthy"
            fi
          fi

      - name: Ensure database indexes and data integrity
        run: |
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()

          # CRITICAL: Deduplicate FIRST (enables unique index creation)
          c.execute('''
              DELETE FROM player_game_logs
              WHERE rowid NOT IN (
                  SELECT MIN(rowid)
                  FROM player_game_logs
                  GROUP BY game_id, player_id
              )
          ''')
          deduped = c.rowcount
          print(f'✅ Deduped {deduped} player_game_logs records')

          # Create UNIQUE index (required for Module H upserts)
          c.execute('CREATE UNIQUE INDEX IF NOT EXISTS idx_player_game_logs_unique ON player_game_logs(game_id, player_id)')

          # Create referee unique index
          c.execute('CREATE UNIQUE INDEX IF NOT EXISTS idx_referee_daily_unique ON referee_daily_stats(referee_id, sync_date)')

          # Create query performance indexes
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_player_date ON player_game_logs(player_id, game_date)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_game_date ON player_game_logs(game_date)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_player_id ON player_game_logs(player_id)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_game_id ON player_game_logs(game_id)')

          conn.commit()
          print('✅ Database indexes and integrity verified')
          conn.close()
          "

      - name: Validate database schema
        run: |
          python3 scripts/validate_schema.py --verbose

      - name: Run Module H (Fetch recent games)
        timeout-minutes: 10
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 module_h_historian.py

      # NOTE: JSON migration step removed - Module H v2.0 writes directly to SQLite

      - name: Sync PBP Stats Season Totals
        timeout-minutes: 15
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/sync_pbp_totals.py

      - name: Sync PBP Stats WOWY Data
        continue-on-error: true  # Non-critical: partial success is acceptable
        timeout-minutes: 30
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/sync_pbp_wowy.py --top 10 --verbose --resume

      - name: Sync Depth Charts
        continue-on-error: true
        timeout-minutes: 5
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          TANK01_TIER: paid
        run: |
          python3 scripts/sync_depth_charts.py

      - name: Sync PBP Shot Quality
        continue-on-error: true
        timeout-minutes: 10
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/sync_pbp_shot_quality.py

      - name: Sync Four-Factor WOWY
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 scripts/sync_four_factor_wowy.py

      - name: Sync Team Leverage Profiles
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 scripts/sync_team_leverage_profiles.py

      - name: Sync Injuries (Overnight Refresh)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          source .venv/bin/activate
          python scripts/sync_injuries.py
        env:
          IS_GAME_DAY_REPORT: "false"
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}

      - name: Sync BDL Clutch Usage
        continue-on-error: true
        timeout-minutes: 10
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          python3 scripts/sync_bdl_clutch_usage.py

      - name: Sync Assist Combos
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 scripts/sync_assist_combos.py

      - name: Sync BDL Tracking Data
        continue-on-error: true
        timeout-minutes: 10
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          python3 scripts/sync_bdl_tracking.py --all

      - name: Build Rotation Profiles (Phase 8.9)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 scripts/build_rotation_profiles.py --window-days 21 --min-games 3

      - name: Update Team Scheme Cache
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 scripts/update_team_scheme_cache.py --db-path ludi.db --verbose
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Validate data freshness
        run: |
          python3 -c "
          import sqlite3
          from datetime import date, timedelta

          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()
          yesterday = (date.today() - timedelta(days=1)).isoformat()

          # Were there NBA games yesterday?
          c.execute('SELECT COUNT(*) FROM games WHERE date = ?', (yesterday,))
          games_yesterday = c.fetchone()[0]

          if games_yesterday == 0:
              print(f'✅ No games on {yesterday} — stale data expected, skipping freshness check')
              conn.close()
              exit(0)

          # Games existed — verify we got game log data
          c.execute('SELECT COUNT(*) FROM player_game_logs WHERE game_date = ?', (yesterday,))
          logs_count = c.fetchone()[0]

          if logs_count == 0:
              print(f'❌ CRITICAL: {games_yesterday} games on {yesterday} but 0 player_game_logs synced')
              print('Module H (Historian) may have failed silently')
              conn.close()
              exit(1)

          # Check enrichment table freshness (warn only, don't fail)
          enrichment = {
              'team_lineups': 'SELECT COUNT(*) FROM team_lineups',
              'four_factor_wowy': 'SELECT COUNT(*) FROM four_factor_wowy',
              'player_defense': 'SELECT COUNT(*) FROM player_defense',
          }
          stale = []
          for table, query in enrichment.items():
              try:
                  c.execute(query)
                  count = c.fetchone()[0]
                  if count == 0:
                      stale.append(table)
              except Exception:
                  stale.append(f'{table} (missing)')

          if stale:
              print(f'⚠️ WARNING: Empty enrichment tables: {stale}')
              print('Individual sync steps may have failed — check logs above')
          else:
              print(f'✅ All enrichment tables populated')

          print(f'✅ Freshness check passed: {logs_count} game logs for {yesterday} ({games_yesterday} games)')
          conn.close()
          "

      - name: Deduplicate games table
        timeout-minutes: 5
        run: |
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()
          # Note: player_game_logs deduplication now happens in 'Ensure database indexes' step
          c.execute('DELETE FROM games WHERE rowid NOT IN (SELECT MIN(rowid) FROM games GROUP BY game_id)')
          deleted = c.rowcount
          print(f'Deleted {deleted} duplicate games')
          conn.commit()
          c.execute('SELECT COUNT(*), MAX(game_date) FROM player_game_logs')
          logs = c.fetchone()
          print(f'Database: {logs[0]} records through {logs[1]}')
          conn.close()
          "

      - name: Validate Canonical IDs
        timeout-minutes: 2
        run: |
          python3 scripts/validate_canonical_ids.py --warn-threshold 100 -v

      - name: Learn Daily Referee Trends
        timeout-minutes: 5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/learn_daily_trends.py

      - name: Analyze Star Bias
        continue-on-error: true  # Non-critical: star bias is supplementary data
        timeout-minutes: 5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          python3 scripts/analyze_star_bias.py

      - name: Commit and push if changes
        run: |
          git config user.name "Ludi Bot"
          git config user.email "noreply@ludibot.com"
          git add logs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: data sync $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi

      - name: Cleanup old logs
        if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/cleanup_old_logs.py --verbose

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 -c "from utils.telegram_notifier import send_message; send_message('❌ WORKFLOW FAILED: ${{ github.workflow }} - Check GitHub Actions')" || echo "Telegram notification failed"

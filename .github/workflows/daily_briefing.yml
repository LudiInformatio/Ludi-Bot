name: Daily Morning Briefing

on:
  schedule:
    # 11:00 AM EST = 16:00 UTC — runs AFTER referee_sync (9:30 AM) and pipeline (10:00 AM)
    # NBA referee assignments publish at ~9 AM; ref sync runs at 9:30 AM; pipeline at 10 AM.
    # Morning brief at 11 AM has all data ready: refs in DB, pipeline output complete.
    # Note: GitHub Actions uses UTC.
    - cron: '0 16 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-slate:
    runs-on: self-hosted
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          source .venv/bin/activate 2>/dev/null || true
          export PYTHONPATH=$PWD
          set +e
          python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            # exit 0 = games today; any unexpected error = fail-open (assume games)
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  briefing:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs



      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Check cache exists (informational)
        continue-on-error: true
        run: |
          python3 -c "
          import os, time
          from datetime import datetime
          date = datetime.now().strftime('%Y-%m-%d')
          cache = f'cache/daily_games_{date}.json'
          if not os.path.exists(cache):
              print('WARNING: Pipeline cache not found - morning brief may use stale data or extra credits')
          else:
              print(f'Cache found: {cache}')
          "

      - name: Verify image pipeline dependencies
        run: |
          python3 -c "from pilmoji import Pilmoji; import PIL; print('img pipeline ok')"

      - name: ESPN Injury Sync (Fast Source — catch morning scratches)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          export PYTHONPATH=$PWD
          source .venv/bin/activate 2>/dev/null || true
          python3 scripts/sync_injuries_espn.py

      - name: Sync Injuries (Pre-Brief Refresh)
        timeout-minutes: 5
        run: |
          source .venv/bin/activate
          python scripts/sync_injuries.py
        env:
          IS_GAME_DAY_REPORT: "true"
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}

      - name: Sync Team Current Info (Tank01)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          source .venv/bin/activate
          python scripts/sync_team_current_info.py
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}

      - name: Run News Agent (Automated News Catalyst Check)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source .venv/bin/activate
          python scripts/news_agent.py --mode automated

      - name: Run Morning Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          export PYTHONPATH=$PWD
          python3 -m morning_brief

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c WORKFLOW FAILED: ${{ github.workflow }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || echo "Slack notification failed"

  notify-off-day:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'false'
    # Runs on ubuntu-latest (no checkout needed — just a curl)
    runs-on: ubuntu-latest
    steps:
      - name: Send no-games Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE_LABEL=$(date '+%b %-d')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="📅 *No NBA games today (${DATE_LABEL})*%0APipeline sleeping\." || echo "Telegram notification failed"

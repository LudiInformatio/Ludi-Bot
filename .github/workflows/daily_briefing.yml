name: Daily Morning Briefing

on:
  schedule:
    # 11:00 AM EST = 16:00 UTC — runs AFTER referee_sync (9:30 AM) and pipeline (10:00 AM)
    # NBA referee assignments publish at ~9 AM; ref sync runs at 9:30 AM; pipeline at 10 AM.
    # Morning brief at 11 AM has all data ready: refs in DB, pipeline output complete.
    # Note: GitHub Actions uses UTC.
    - cron: '0 16 * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: daily-briefing
  cancel-in-progress: false # false — pushes were cancelling scheduled runs (cancel: true + push guard = destructive)

jobs:
  check-slate:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          export PYTHONPATH=$PWD
          set +e
          .venv/bin/python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            # exit 0 = games today; any unexpected error = fail-open (assume games)
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  briefing:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs



      - name: Install Dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Wait for pipeline cache (A2 gate — 5-min poll)
        timeout-minutes: 6
        run: |
          # If the 10 AM pipeline runs late, wait up to 5 min before proceeding.
          # Cache miss is non-fatal: morning_brief fetches fresh (costs ~460-730 extra credits).
          CACHE="cache/daily_games_$(date +'%Y-%m-%d').json"
          if [ -f "$CACHE" ]; then
            echo "✅ Cache found — proceeding immediately"
          else
            echo "⏳ Cache not found — waiting up to 5 min for pipeline to complete..."
            for i in $(seq 1 10); do
              sleep 30
              if [ -f "$CACHE" ]; then
                echo "✅ Cache appeared at attempt $i — proceeding"
                break
              fi
              echo "  Attempt $i/10 — still waiting..."
            done
            [ -f "$CACHE" ] || echo "⚠️  Cache still missing — brief will fetch fresh (extra credits)"
          fi

      - name: ESPN Injury Sync (Fast Source — catch morning scratches)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/sync_injuries_espn.py

      - name: Sync Injuries (Pre-Brief Refresh)
        timeout-minutes: 5
        run: |
          .venv/bin/python scripts/sync_injuries.py --force
        env:
          IS_GAME_DAY_REPORT: "true"
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}

      - name: Sync Team Current Info (Tank01)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          .venv/bin/python scripts/sync_team_current_info.py
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}

      - name: Run News Agent (Automated News Catalyst Check)
        continue-on-error: true
        timeout-minutes: 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/news_agent.py --mode automated

      - name: Run Morning Briefing
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -m morning_brief

      - name: Notify on failure
        if: failure()
        run: |
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Daily Morning Briefing')" || echo "Solomon notification failed"

  notify-off-day:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'false'
    # Runs on ubuntu-latest (no checkout needed — just a curl)
    runs-on: ubuntu-latest
    steps:
      - name: Send no-games Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE_LABEL=$(date '+%b %-d')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="📅 *No NBA games today (${DATE_LABEL})*%0APipeline sleeping\." || echo "Telegram notification failed"

name: Daily Production Pipeline

on:
  schedule:
    # Daily at 10:00 AM EDT (14:00 UTC) — 7 days (NBA has weekend games)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (limits to 1 game)'
        required: false
        default: 'false'
        type: string

concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  check-slate:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      has_games: ${{ steps.check.outputs.has_games }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check today's NBA slate
        id: check
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          export PYTHONPATH=$PWD
          set +e
          .venv/bin/python scripts/check_slate.py
          CODE=$?
          set -e
          if [ $CODE -eq 2 ]; then
            echo "has_games=false" >> $GITHUB_OUTPUT
          else
            echo "has_games=true" >> $GITHUB_OUTPUT
          fi

  run-production-pipeline:
    needs: [check-slate]
    if: needs.check-slate.outputs.has_games == 'true'
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs

      - name: Setup Python Environment
        timeout-minutes: 5
        run: |
          if [ ! -d ".venv" ]; then
            python3.11 -m venv .venv
          fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright browsers
        timeout-minutes: 3
        run: |
          .venv/bin/python -m playwright install chromium

      - name: Verify Environment
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          .venv/bin/python -c "import config; print('Environment validated')"

      - name: Create Production Logs Directory
        run: |
          mkdir -p logs/production
          mkdir -p logs/health
          mkdir -p assets/generated

      - name: Verify data freshness before simulation
        continue-on-error: true
        run: |
          .venv/bin/python -c "
          import sqlite3
          from datetime import date, timedelta

          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()

          # Check: do we have game log data from the last 48 hours?
          two_days_ago = (date.today() - timedelta(days=2)).isoformat()
          c.execute('SELECT COUNT(*), MAX(game_date) FROM player_game_logs WHERE game_date >= ?', (two_days_ago,))
          count, latest = c.fetchone()

          if count > 0:
              print(f'✅ Data is fresh: {count} game logs since {two_days_ago} (latest: {latest})')
              conn.close()
              exit(0)

          # No recent data — check if there were games (could be All-Star break)
          c.execute('SELECT COUNT(*) FROM games WHERE date >= ?', (two_days_ago,))
          recent_games = c.fetchone()[0]

          if recent_games == 0:
              print(f'✅ No NBA games in last 48h — stale data expected (All-Star break / off day)')
              conn.close()
              exit(0)

          # Games existed but no fresh logs — data_sync may have failed
          c.execute('SELECT MAX(game_date) FROM player_game_logs')
          last_log = c.fetchone()[0]
          print(f'❌ STALE DATA: {recent_games} games in last 48h but latest game log is {last_log}')
          print('data_sync.yml may have failed — check workflow history')
          conn.close()
          exit(1)
          "
      - name: Refresh Scoring Environment Cache
        continue-on-error: true
        timeout-minutes: 2
        run: |
          .venv/bin/python scripts/sync_scoring_environment.py

      - name: Run Daily Simulation Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
        run: |
          export PYTHONPATH=$PWD

          # Set production flag
          export IS_PRODUCTION=true
          export DEBUG_LOG=false

          # Determine test mode
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            export LIMIT_GAMES=1
            echo "Running in TEST MODE (1 game only)"
          else
            echo "Running FULL PRODUCTION pipeline"
          fi

          # Run main pipeline
          echo "Starting pipeline at $(date)"

          .venv/bin/python main.py --send-telegram 2>&1 | tee logs/production/pipeline_$(date +%Y%m%d).log

          # Check if pipeline completed successfully
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "Pipeline completed successfully"
          else
            echo "Pipeline failed with exit code ${PIPESTATUS[0]}"
            exit 1
          fi

      - name: Validate Pipeline Output
        # Phase 3B: Output assertion gate — 5 canary checks on bet quality/count/edge
        # continue-on-error so archive/notify steps still run even if checks flag issues
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/validate_pipeline_output.py --mode post

      - name: Curate Top Plays (Claude AI Gate)
        # Phase 8.5: Two-stage AI curation — Haiku sanity gate + Sonnet Top 5 selection
        # Gracefully degrades to edge-sorted fallback if Claude is unavailable
        continue-on-error: true
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_SOLOMON: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID_SOLOMON: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
          SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/curate_plays.py --run-date $(date +%Y-%m-%d)

      - name: Run System Health Monitor
        if: always()
        continue-on-error: true
        # Health monitor is the early warning for model drift — must fail loudly so Ops Hub catches it
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python scripts/monitor_system_health.py --production-mode

      - name: Send Production Summary
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -x
          export PYTHONPATH=$PWD

          LOG_FILE="logs/production/pipeline_$(date +%Y%m%d).log"
          if [ -f "$LOG_FILE" ]; then
            # Use tr to ensure we only get digits (sanitize newline/whitespace)
            GAMES=$(grep -c "GAME" "$LOG_FILE" 2>/dev/null || true)
            GAMES=${GAMES:-0}

            BETS=$(grep -c -E "DIAMOND|BLUE CHIP|CORE ASSET|THE STEAL" "$LOG_FILE" 2>/dev/null || true)
            BETS=${BETS:-0}

            ERRS=$(grep -c -E "ERROR|Error" "$LOG_FILE" 2>/dev/null || true)
            ERRS=${ERRS:-0}

            echo "DEBUG: Games: '${GAMES}', Bets: '${BETS}', Errors: '${ERRS}'"
            .venv/bin/python scripts/send_workflow_summary.py --games "$GAMES" --bets "$BETS" --errors "$ERRS" || echo "Summary notification skipped"
          else
            echo "Log file not found, skipping summary"
          fi

      - name: Archive Production Logs
        if: always()
        run: |
          cd logs/production
          if [ -f "pipeline_$(date +%Y%m%d).log" ]; then
            gzip "pipeline_$(date +%Y%m%d).log" || true
          fi
          find . -name "*.log.gz" -mtime +30 -delete || true
          find ../assets/generated -name "*.png" -mtime +7 -delete 2>/dev/null || true

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_SOLOMON }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_SOLOMON }}
        run: |
          export PYTHONPATH=$PWD
          .venv/bin/python -c "from utils.telegram_notifier import send_solomon_message; send_solomon_message('WORKFLOW FAILED: Daily Production Pipeline')" || echo "Telegram notification failed"
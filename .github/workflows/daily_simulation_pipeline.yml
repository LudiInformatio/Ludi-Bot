name: Daily Production Pipeline

on:
  schedule:
    # Daily at 11:00 AM EST (15:00 UTC)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (limits to 1 game)'
        required: false
        default: 'false'
        type: string

jobs:
  run-production-pipeline:
    runs-on: self-hosted
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs
        
      - name: Setup Python Environment
        run: |
          if [ ! -d ".venv" ]; then
            python3.11 -m venv .venv
          fi
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          source .venv/bin/activate
          python -m playwright install chromium
          
      - name: Verify Environment
        run: |
          source .venv/bin/activate
          python -c "import config; print('✅ Environment validated')"
          
      - name: Create Production Logs Directory
        run: |
          mkdir -p logs/production
          mkdir -p assets/generated
          
      - name: Run Daily Simulation Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          
          # Set production flag
          export IS_PRODUCTION=true
          export DEBUG_LOG=false

          # Determine test mode
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            export LIMIT_GAMES=1
            echo "🧪 Running in TEST MODE (1 game only)"
          else
            echo "🚀 Running FULL PRODUCTION pipeline"
          fi

          # Run main pipeline
          echo "⏰ Starting pipeline at $(date)"
          python main.py --send-telegram 2>&1 | tee logs/production/pipeline_$(date +%Y%m%d).log
          
          # Check if pipeline completed successfully
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Pipeline completed successfully"
          else
            echo "❌ Pipeline failed with exit code ${PIPESTATUS[0]}"
            exit 1
          fi
          
      - name: Run System Health Monitor
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          python scripts/monitor_system_health.py --production-mode
          
      - name: Archive Production Logs
        run: |
          # Compress today's logs
          cd logs/production
          if [ -f "pipeline_$(date +%Y%m%d).log" ]; then
            gzip "pipeline_$(date +%Y%m%d).log" || true
          fi
          
          # Clean up old artifacts (keep 30 days)
          find . -name "*.log.gz" -mtime +30 -delete || true
          find ../assets/generated -name "*.png" -mtime +7 -delete || true
          
      - name: Send Production Summary
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          
          LOG_FILE="logs/production/pipeline_$(date +%Y%m%d).log"
          if [ -f "$LOG_FILE" ]; then
            GAMES_PROCESSED=$(grep -c "🏀 GAME" "$LOG_FILE" || echo "0")
            BETS_GENERATED=$(grep -c "💎 DIAMOND\|🔷 BLUE CHIP\|💙 CORE ASSET\|🎯 THE STEAL" "$LOG_FILE" || echo "0")
            ERRORS=$(grep -c "❌\|🚨\|ERROR" "$LOG_FILE" || echo "0")
            DATE_STR=$(date +%Y-%m-%d)
            TIME_STR=$(date +%H:%M:%S)
            
            MSG="📊 PROD SUMMARY ${DATE_STR} | 🏀 Games: ${GAMES_PROCESSED} | 💎 Bets: ${BETS_GENERATED} | ❌ Errors: ${ERRORS} | ⏰ ${TIME_STR}"
            python3 -c "from utils.telegram_notifier import send_message; send_message('$MSG')" || echo "Telegram notification failed"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 -c "from utils.telegram_notifier import send_message; send_message('❌ WORKFLOW FAILED: ${{ github.workflow }} - Check GitHub Actions')" || echo "Telegram notification failed"
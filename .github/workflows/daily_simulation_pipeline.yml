name: Daily Production Pipeline

on:
  schedule:
    # Daily at 11:00 AM EST (15:00 UTC)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (limits to 1 game)'
        required: false
        default: 'false'
        type: string

jobs:
  run-production-pipeline:
    runs-on: self-hosted
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve ludi.db between runs
        
      - name: Setup Python Environment
        run: |
          if [ ! -d ".venv" ]; then
            python3.11 -m venv .venv
          fi
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          source .venv/bin/activate
          python -m playwright install chromium
          
      - name: Verify Environment
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          source .venv/bin/activate
          python -c "import config; print('Environment validated')"
          
      - name: Create Production Logs Directory
        run: |
          mkdir -p logs/production
          mkdir -p logs/health
          mkdir -p assets/generated

      - name: Ensure database indexes and data integrity
        run: |
          source .venv/bin/activate
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('ludi.db')
          c = conn.cursor()

          # CRITICAL: Deduplicate FIRST (enables unique index creation)
          c.execute('''
              DELETE FROM player_game_logs
              WHERE rowid NOT IN (
                  SELECT MIN(rowid)
                  FROM player_game_logs
                  GROUP BY game_id, player_id
              )
          ''')
          deduped = c.rowcount
          print(f'✅ Deduped {deduped} player_game_logs records')

          # Create UNIQUE index (required for Module H upserts)
          c.execute('CREATE UNIQUE INDEX IF NOT EXISTS idx_player_game_logs_unique ON player_game_logs(game_id, player_id)')

          # Create referee unique index
          c.execute('CREATE UNIQUE INDEX IF NOT EXISTS idx_referee_daily_unique ON referee_daily_stats(referee_id, sync_date)')

          # Create query performance indexes
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_player_date ON player_game_logs(player_id, game_date)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_game_date ON player_game_logs(game_date)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_player_id ON player_game_logs(player_id)')
          c.execute('CREATE INDEX IF NOT EXISTS idx_player_game_logs_game_id ON player_game_logs(game_id)')

          conn.commit()
          print('✅ Database indexes and integrity verified')
          conn.close()
          "

      - name: Run Daily Simulation Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          
          # Set production flag
          export IS_PRODUCTION=true
          export DEBUG_LOG=false

          # Determine test mode
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            export LIMIT_GAMES=1
            echo "Running in TEST MODE (1 game only)"
          else
            echo "Running FULL PRODUCTION pipeline"
          fi

          # Run main pipeline
          echo "Starting pipeline at $(date)"
          python main.py --send-telegram 2>&1 | tee logs/production/pipeline_$(date +%Y%m%d).log
          
          # Check if pipeline completed successfully
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "Pipeline completed successfully"
          else
            echo "Pipeline failed with exit code ${PIPESTATUS[0]}"
            exit 1
          fi
          
      - name: Run System Health Monitor
        continue-on-error: true  # Health alerts sent via Telegram; don't fail workflow
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_TIER: paid
          TANK01_TIER: paid
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          python scripts/monitor_system_health.py --production-mode

      - name: Send Production Summary
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -x
          source .venv/bin/activate
          export PYTHONPATH=$PWD
          
          LOG_FILE="logs/production/pipeline_$(date +%Y%m%d).log"
          if [ -f "$LOG_FILE" ]; then
            # Use tr to ensure we only get digits (sanitize newline/whitespace)
            GAMES=$(grep -c "GAME" "$LOG_FILE" 2>/dev/null || true)
            GAMES=${GAMES:-0}
            
            BETS=$(grep -c -E "DIAMOND|BLUE CHIP|CORE ASSET|THE STEAL" "$LOG_FILE" 2>/dev/null || true)
            BETS=${BETS:-0}
            
            ERRS=$(grep -c -E "ERROR|Error" "$LOG_FILE" 2>/dev/null || true)
            ERRS=${ERRS:-0}
            
            echo "DEBUG: Games: '${GAMES}', Bets: '${BETS}', Errors: '${ERRS}'"
            python3 scripts/send_workflow_summary.py --games "$GAMES" --bets "$BETS" --errors "$ERRS" || echo "Summary notification skipped"
          else
            echo "Log file not found, skipping summary"
          fi
          
      - name: Archive Production Logs
        run: |
          cd logs/production
          if [ -f "pipeline_$(date +%Y%m%d).log" ]; then
            gzip "pipeline_$(date +%Y%m%d).log" || true
          fi
          find . -name "*.log.gz" -mtime +30 -delete || true
          find ../assets/generated -name "*.png" -mtime +7 -delete 2>/dev/null || true

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PWD
          python3 -c "from utils.telegram_notifier import send_message; send_message('WORKFLOW FAILED: Daily Production Pipeline')" || echo "Telegram notification failed"